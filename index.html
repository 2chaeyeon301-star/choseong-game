<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="채연 룰렛">
<link rel="apple-touch-icon" href="icon.png">
<title>채연 룰렛</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
  :root{
    --ground:#1A1040;
    --ground-deep:#120A2E;
    --panel:#261A57;
    --panel-edge:#3A2A7A;
    --amber:#FFC93C;
    --pink:#FF5C8A;
    --mint:#4EE6B8;
    --text:#F5F1FF;
    --text-dim:#B9AEE0;
    --display:'Black Han Sans', 'Noto Sans KR', sans-serif;
    --body:'Gowun Dodum', 'Noto Sans KR', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #2E1E66 0%, var(--ground) 55%, var(--ground-deep) 100%);
    color:var(--text);
    font-family:var(--body);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    min-height:100svh;   /* iOS Safari 툴바를 제외한 실제 보이는 높이 */
    padding:24px 16px 32px;
  }
  @media (max-width:700px){
    body{padding:12px 10px 20px;}
  }

  /* ── 헤더 ─────────────────────────── */
  header{
    width:100%;
    max-width:860px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand h1{
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(24px, 4vw, 32px);
    letter-spacing:1px;
    color:var(--text);
  }
  .brand h1 .dot{color:var(--pink);}
  .brand .tag{
    font-size:13px;
    color:var(--text-dim);
    letter-spacing:2px;
  }
  .headBtns{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
  .pillBtn{
    background:var(--panel);
    border:1px solid var(--panel-edge);
    color:var(--text);
    border-radius:999px;
    padding:8px 16px;
    font-family:var(--body);
    font-size:14px;
    cursor:pointer;
    transition:background .15s;
  }
  .pillBtn:hover{background:var(--panel-edge);}
  .pillBtn:focus-visible{outline:2px solid var(--mint); outline-offset:2px;}
  .pillBtn[aria-pressed="false"]{color:var(--text-dim);}

  /* ── 탭 줄 (게임 선택 + 모드/난이도 좌우 배치) ── */
  .tabsRow{
    margin-top:16px;
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;      /* 화면이 좁으면 자동 줄바꿈 */
    max-width:100%;
  }

  /* ── 게임 선택 탭 ────────────────────── */
  .gameTabs{
    display:flex;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:999px;
    padding:6px;
  }
  .gameTabs button{
    border:0;
    background:transparent;
    color:var(--text-dim);
    font-family:var(--body);
    font-size:15px;
    padding:10px 24px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .gameTabs button[aria-pressed="true"]{
    background:var(--pink);
    color:#3A0016;
  }
  .gameTabs button:focus-visible{outline:2px solid var(--mint); outline-offset:2px;}
  .gameTabs button:disabled{opacity:.45; cursor:default;}

  /* ── 모드 탭 ─────────────────────────── */
  .modes{
    display:flex;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:999px;
    padding:6px;
  }
  .modes button{
    border:0;
    background:transparent;
    color:var(--text-dim);
    font-family:var(--body);
    font-size:15px;
    padding:10px 22px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .modes button[aria-pressed="true"]{
    background:var(--amber);
    color:#241500;
  }
  .modes button:focus-visible{outline:2px solid var(--mint); outline-offset:2px;}
  .modes button:disabled{opacity:.45; cursor:default;}

  /* ── 무대 ─────────────────────────── */
  .stage{
    margin-top:26px;
    width:100%;
    max-width:860px;
    flex:1;
    min-height:420px;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    position:relative;
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
    padding:24px 16px;
  }
  @media (max-width:700px){
    .stage{min-height:340px; border-radius:20px; gap:10px; margin-top:16px;}
    .btn{font-size:19px; padding:13px 30px;}
    .hint{font-size:14px;}
  }
  /* 화면 높이가 낮은 환경(가로 모드 등) — 버튼까지 한 화면에 들어오도록 축소 */
  @media (max-height:780px){
    body{padding:10px 10px 16px;}
    .tabsRow{margin-top:10px; gap:8px;}
    .gameTabs button, .modes button{padding:8px 14px; font-size:14px;}
    .stage{margin-top:14px; min-height:300px; gap:8px;}
    .bigWrap{height:clamp(96px, 21vh, 190px); padding:6px 0;}
    .big{font-size:clamp(52px, min(30vw, 17vh), 150px);}
    .big.two{font-size:clamp(44px, min(24vw, 17vh), 140px);}
    .hint{font-size:14px; line-height:1.5;}
    .btn{font-size:18px; padding:11px 30px;}
    .btn-reset{padding:11px 18px;}
    .answers{margin-top:12px; min-height:36px;}
    .chips{max-height:50px;}
  }
  .stage::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(520px 320px at 50% 42%, rgba(255,201,60,.10), transparent 70%);
    pointer-events:none;
  }

  /* ── 팝업 모달 (점수판·타이머 공용) ── */
  .modal{
    position:fixed;
    inset:0;
    z-index:50;
    background:rgba(10,6,30,.78);
    backdrop-filter:blur(4px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modalCard{
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:24px;
    padding:22px 26px 26px;
    width:min(700px, 94vw);
    max-height:92vh;
    overflow:auto;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .modalHead{display:flex; justify-content:space-between; align-items:center;}
  .modalHead h2{
    font-family:var(--display);
    font-weight:400;
    font-size:24px;
    letter-spacing:1px;
    color:var(--text);
  }
  .modalClose{
    background:transparent;
    border:0;
    color:var(--text-dim);
    font-size:24px;
    cursor:pointer;
    padding:4px 10px;
    line-height:1;
  }
  .modalClose:hover{color:var(--text);}
  .modalClose:focus-visible{outline:2px solid var(--mint); outline-offset:2px;}

  /* 점수판 */
  .scoreGrid{display:flex; gap:16px; justify-content:center; flex-wrap:wrap;}
  .scorePod{
    flex:1;
    min-width:230px;
    background:var(--ground-deep);
    border:1px solid var(--panel-edge);
    border-radius:20px;
    padding:20px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .scorePod .teamName{
    font-size:clamp(16px, 2.4vw, 21px);
    letter-spacing:1px;
    text-align:center;
  }
  .scorePod.teamA .teamName{color:var(--amber);}
  .scorePod.teamB .teamName{color:#5AA7FF;}
  .scoreNum{
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(64px, 13vh, 110px);
    line-height:1;
    color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  @keyframes bump{0%{transform:scale(1.35);}100%{transform:scale(1);}}
  .scoreNum.bump{animation:bump .25s ease;}
  .scoreBtns{display:flex; gap:14px;}
  .sBtn{
    width:58px; height:58px;
    border-radius:50%;
    border:1px solid var(--panel-edge);
    background:var(--panel);
    color:var(--text);
    font-size:28px;
    line-height:1;
    cursor:pointer;
  }
  .sBtn.plus{border-color:rgba(78,230,184,.55); color:var(--mint);}
  .sBtn.minus{color:var(--text-dim);}
  .sBtn:active{transform:scale(.88);}
  .sBtn:focus-visible{outline:2px solid var(--mint); outline-offset:2px;}
  .scoreReset{
    align-self:center;
    background:transparent;
    border:1px solid var(--panel-edge);
    color:var(--text-dim);
    border-radius:999px;
    padding:9px 24px;
    font-family:var(--body);
    font-size:14px;
    cursor:pointer;
  }
  .scoreReset:hover{color:var(--text);}

  /* 타이머 */
  .timerDisp{
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(80px, 20vh, 150px);
    line-height:1;
    text-align:center;
    color:var(--amber);
    font-variant-numeric:tabular-nums;
    letter-spacing:2px;
  }
  .timerDisp.danger{color:var(--pink);}
  @keyframes timeUp{0%,100%{opacity:1;}50%{opacity:.25;}}
  .timerDisp.done{color:var(--pink); animation:timeUp .5s ease-in-out 6;}
  .timerPresets{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .timerPresets button{
    background:var(--ground-deep);
    border:1px solid var(--panel-edge);
    color:var(--text-dim);
    border-radius:999px;
    padding:9px 20px;
    font-family:var(--body);
    font-size:15px;
    cursor:pointer;
  }
  .timerPresets button[aria-pressed="true"]{
    background:var(--amber);
    border-color:var(--amber);
    color:#241500;
  }
  .timerPresets button:focus-visible{outline:2px solid var(--mint); outline-offset:2px;}
  .timerCtrl{display:flex; gap:12px; justify-content:center;}

  @media (prefers-reduced-motion: reduce){
    .scoreNum.bump{animation:none;}
    .timerDisp.done{animation:none;}
  }

  .hint{
    color:var(--text-dim);
    font-size:16px;
    text-align:center;
    line-height:1.7;
    max-width:34em;
    padding:0 20px;
  }

  /* 대형 표시 영역 */
  .bigWrap{
    height:clamp(125px, 28vh, 280px);
    padding:10px 0;
    max-width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .big{
    font-family:var(--display);
    font-weight:400;
    line-height:1.1;
    /* 가로·세로 어느 쪽도 넘치지 않게 — 두 글자 모드(글자 2개)를 기준으로 가로 제한 */
    font-size:clamp(64px, min(38vw, 22vh), 200px);
    letter-spacing:.04em;
    user-select:none;
    white-space:nowrap;
  }
  .big.two{font-size:clamp(56px, min(30vw, 22vh), 180px);}
  .big.count{color:var(--amber);}
  .big.count.n2{color:var(--mint);}
  .big.count.n1{color:var(--pink);}
  .big.jamo{
    color:var(--pink);
    text-shadow:0 0 60px rgba(255,92,138,.45);
  }
  /* 이모지 퀴즈 문제 */
  .big.emoji{
    font-size:clamp(38px, min(12vw, 11vh), 88px);
    letter-spacing:.08em;
    white-space:nowrap;
    text-shadow:none;
  }
  /* 텔레스트레이션 단어 카드 */
  .big.word{
    font-size:clamp(40px, min(15vw, 13vh), 104px);
    color:var(--mint);
    text-shadow:0 0 50px rgba(78,230,184,.4);
    white-space:nowrap;
  }
  .big.qmark{
    color:var(--amber);
    text-shadow:0 0 50px rgba(255,201,60,.4);
  }
  /* 3힌트 퀴즈 — 힌트 문장이 쌓이는 박스 */
  .big.hintbox{
    font-family:var(--body);
    font-size:clamp(16px, min(3vw, 3vh), 24px);
    line-height:1.75;
    white-space:normal;
    text-align:left;
    max-width:min(560px, 90vw);
    color:var(--text);
    text-shadow:none;
    letter-spacing:0;
  }
  .big.hintbox .hLabel{
    font-family:var(--display);
    color:var(--amber);
    margin-right:10px;
    letter-spacing:1px;
  }
  .big.hintbox div{animation:reveal .4s ease both;}
  /* 이모지 퀴즈 정답 — 긴 제목도 줄바꿈되며 화면 안에 들어오게 */
  .big.title{
    font-size:clamp(28px, min(9vw, 9vh), 72px);
    white-space:normal;
    text-align:center;
    line-height:1.25;
    max-width:92vw;
  }

  @keyframes pop{
    0%  {transform:scale(2.2); opacity:0;}
    55% {transform:scale(.95); opacity:1;}
    100%{transform:scale(1);   opacity:1;}
  }
  @keyframes reveal{
    0%  {transform:scale(.3) rotate(-6deg); opacity:0;}
    60% {transform:scale(1.12) rotate(2deg); opacity:1;}
    100%{transform:scale(1) rotate(0);      opacity:1;}
  }
  .big.count, .big.qmark{animation:pop .9s cubic-bezier(.2,.9,.3,1) both;}
  .big.jamo, .big.word, .big.emoji{animation:reveal .55s cubic-bezier(.2,.9,.3,1.2) both;}

  .ring{
    position:absolute;
    width:clamp(220px, 36vh, 340px);
    height:clamp(220px, 36vh, 340px);
    border-radius:50%;
    border:3px solid currentColor;
    opacity:0;
    pointer-events:none;
  }
  @keyframes ringOut{
    0%  {transform:scale(.6); opacity:.7;}
    100%{transform:scale(1.25); opacity:0;}
  }
  .ring.go{animation:ringOut .85s ease-out both;}

  /* ── 듣기 상태 / 판정 ─────────────────── */
  .listen{
    display:flex;
    align-items:center;
    gap:10px;
    min-height:32px;
  }
  .micPill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(78,230,184,.12);
    border:1px solid rgba(78,230,184,.4);
    color:var(--mint);
    border-radius:999px;
    padding:6px 14px;
    font-size:14px;
  }
  .micPill::before{
    content:"";
    width:8px; height:8px;
    border-radius:50%;
    background:var(--mint);
    animation:blink 1.2s ease-in-out infinite;
  }
  .micPill.off{
    color:var(--text-dim);
    border-color:var(--panel-edge);
    background:transparent;
  }
  .micPill.off::before{background:var(--text-dim); animation:none;}
  @keyframes blink{0%,100%{opacity:1;} 50%{opacity:.25;}}
  .heard{
    color:var(--text-dim);
    font-size:15px;
    max-width:26em;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* 다음 힌트 카운트다운 배지 */
  .hintTimer{
    background:rgba(255,201,60,.12);
    border:1px solid rgba(255,201,60,.4);
    color:var(--amber);
    border-radius:999px;
    padding:6px 16px;
    font-size:14px;
  }
  .hintTimer b{
    font-family:var(--display);
    font-weight:400;
    font-size:16px;
    font-variant-numeric:tabular-nums;
  }

  /* 정답 팀 선택 */
  .teamPick{
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    min-height:36px;
  }
  .teamPick .tpLabel{color:var(--text); font-size:16px;}
  .teamPick button{
    border-radius:999px;
    padding:9px 18px;
    font-family:var(--body);
    font-size:15px;
    cursor:pointer;
    border:1px solid var(--panel-edge);
    background:var(--ground-deep);
    color:var(--text);
    transition:transform .12s, filter .15s;
  }
  .teamPick button:hover{filter:brightness(1.2); transform:translateY(-1px);}
  .teamPick button[data-team="A"]{border-color:var(--amber); color:var(--amber);}
  .teamPick button[data-team="B"]{border-color:#5AA7FF; color:#5AA7FF;}
  .teamPick button[data-team="skip"]{color:var(--text-dim);}
  .teamPick button:focus-visible{outline:2px solid var(--mint); outline-offset:2px;}

  .verdict{
    min-height:30px;
    font-size:19px;
    text-align:center;
  }
  .verdict.ok{color:var(--mint);}
  .verdict.bad{color:var(--pink); animation:shake .35s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-7px);}
    50%{transform:translateX(7px);}
    75%{transform:translateX(-4px);}
  }

  @media (prefers-reduced-motion: reduce){
    .big.count, .big.jamo, .big.qmark, .big.word, .big.emoji{animation:none;}
    .ring.go{animation:none; opacity:0;}
    .micPill::before{animation:none;}
    .verdict.bad{animation:none;}
  }

  /* ── 버튼 ─────────────────────────── */
  .actions{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
  .btn{
    font-family:var(--display);
    font-weight:400;
    font-size:22px;
    letter-spacing:2px;
    border:0;
    border-radius:18px;
    padding:16px 44px;
    cursor:pointer;
    transition:transform .12s, filter .15s;
  }
  .btn:hover{filter:brightness(1.1); transform:translateY(-2px);}
  .btn:active{transform:translateY(0) scale(.97);}
  .btn:focus-visible{outline:3px solid var(--mint); outline-offset:3px;}
  .btn-start{
    background:linear-gradient(180deg, #FFD75E, var(--amber));
    color:#241500;
    box-shadow:0 10px 30px rgba(255,201,60,.30);
  }
  .btn-next{
    background:linear-gradient(180deg, #FF7CA0, var(--pink));
    color:#3A0016;
    box-shadow:0 10px 30px rgba(255,92,138,.30);
  }
  .btn-speak{
    background:linear-gradient(180deg, #6FF0C8, var(--mint));
    color:#00382A;
    box-shadow:0 10px 30px rgba(78,230,184,.30);
  }
  @keyframes pulseBtn{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
  .btn-speak.listening{animation:pulseBtn 1s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){
    .btn-speak.listening{animation:none;}
  }
  .btn-reset{
    background:transparent;
    border:1px solid var(--panel-edge);
    color:var(--text-dim);
    font-family:var(--body);
    font-size:15px;
    letter-spacing:0;
    padding:16px 24px;
  }
  .btn-reset:hover{color:var(--text);}

  /* ── 정답 단어 ─────────────────────── */
  .answers{
    margin-top:20px;
    width:100%;
    max-width:860px;
    min-height:44px;
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .answers .label{
    font-size:13px;
    color:var(--text-dim);
    letter-spacing:2px;
    white-space:nowrap;
    padding-top:9px;
  }
  .answers .count{
    color:var(--mint);
    font-size:13px;
    padding-top:9px;
  }
  .chips{
    display:flex; gap:8px; flex-wrap:wrap;
    max-height:88px;          /* 단어가 많아져도 리스트 안에서만 스크롤 — 화면이 밀리지 않게 */
    overflow-y:auto;
  }
  .chip.placeholder{
    color:var(--text-dim);
    border-style:dashed;
    font-size:14px;
  }
  .chip{
    font-family:var(--body);
    font-size:16px;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:12px;
    padding:7px 14px;
  }
  .chip b{
    font-family:var(--display);
    font-weight:400;
    color:var(--text-dim);
    font-size:13px;
    margin-right:6px;
  }
  .chip.latest{border-color:var(--mint); color:var(--mint);}
  .chip.latest b{color:var(--mint);}
</style>

<header>
  <div class="brand">
    <h1>채연 룰렛<span class="dot">.</span></h1>
    <span class="tag">PARTY GAMES</span>
  </div>
  <div class="headBtns">
    <button class="pillBtn" id="timerTog">⏱️ 타이머</button>
    <button class="pillBtn" id="scoreTog">🏆 점수판</button>
    <button class="pillBtn" id="micBtn" aria-pressed="true">🎤 음성인식</button>
    <button class="pillBtn" id="soundBtn" aria-pressed="true">🔊 소리 켜짐</button>
  </div>

  const HINT_CAT_NAMES = { person:'인물', food:'음식', movie:'영화', place:'장소' };

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

                 (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  /* ── 사운드 ── */
  function ctx(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      /* iOS 오디오 잠금 해제 — 사용자 제스처 안에서 무음 버퍼를 한 번 재생해야 이후 소리가 난다 */
      const buf = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      src.start(0);
    }
    if(audioCtx.state !== 'running') audioCtx.resume();
    if(soundOn && !bgmTimer) bgmStart();   // 소리가 켜져 있으면 첫 조작 때 배경음악도 함께 시작
    return audioCtx;
  }
  function tone(freq, start, dur, vol, type){
    const ac = ctx();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    const t = ac.currentTime + start;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  }
  function beepCount(){ if(soundOn) tone(660, 0, 0.22, 0.22); }
  function chimeReveal(){
    if(!soundOn) return;
    tone(880, 0, 0.35, 0.20);
    tone(1108.7, 0.09, 0.35, 0.16);
    tone(1318.5, 0.18, 0.5, 0.16);
  }
  function chimePass(){
    if(!soundOn) return;
    tone(987.8, 0, 0.18, 0.2);
    tone(1318.5, 0.1, 0.3, 0.2);
  }
  function buzzFail(){
    if(!soundOn) return;
    tone(196, 0, 0.28, 0.18, 'square');
    tone(185, 0.05, 0.28, 0.12, 'square');
  }

  /* ── 배경음악 (파일 없이 Web Audio로 합성하는 루프) — 🔊 소리 버튼에 통합 ── */
  let bgmGain = null;
  let bgmTimer = null;
  let bgmStep = 0;
  let bgmNext = 0;

  const BGM_STEP = 60 / 96 / 2;   // 96BPM 8분음표
  /* Cmaj7 → Am7 → Fmaj7 → G6 진행, 각 코드 8스텝 */
  const BGM_CHORDS = [
    [261.63, 329.63, 392.00, 493.88],
    [220.00, 261.63, 329.63, 392.00],
    [174.61, 220.00, 261.63, 329.63],
    [196.00, 246.94, 293.66, 329.63]
  ];
  const BGM_ARP = [0, 1, 2, 3, 2, 3, 1, 2];

  function bgmNote(freq, start, dur, vol, type){
    const ac = ctx();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g).connect(bgmGain);
    o.start(start);
    o.stop(start + dur + 0.05);
  }
  function bgmScheduleStep(step, t){
    const chord = BGM_CHORDS[Math.floor(step / 8)];
    bgmNote(chord[BGM_ARP[step % 8]], t, 0.34, 0.045, 'triangle');
    if(step % 8 === 0) bgmNote(chord[0] / 2, t, 1.4, 0.075, 'sine');          // 베이스
    if(step % 8 === 4) bgmNote(chord[3] * 2, t, 0.5, 0.016, 'sine');          // 반짝임
  }
  function bgmScheduler(){
    const ac = ctx();
    while(bgmNext < ac.currentTime + 0.35){
      bgmScheduleStep(bgmStep, bgmNext);
      bgmNext += BGM_STEP;
      bgmStep = (bgmStep + 1) % 32;
    }
  }
  function bgmDuck(down){
    if(!bgmGain) return;
    bgmGain.gain.setTargetAtTime(down ? 0.15 : 1, ctx().currentTime, 0.15);
  }
  function bgmStart(){
    if(bgmTimer || !audioCtx) return;
    if(!bgmGain){
      bgmGain = audioCtx.createGain();
      bgmGain.gain.value = 1;
      bgmGain.connect(audioCtx.destination);
    }
    bgmStep = 0;
    bgmNext = audioCtx.currentTime + 0.05;
    bgmTimer = setInterval(bgmScheduler, 150);   // 타이머를 먼저 걸어 ctx() 재진입을 막는다
    bgmScheduler();
  }
  function bgmStop(){
    clearInterval(bgmTimer);
    bgmTimer = null;
  }

    soundBtn.textContent = soundOn ? '🔊 소리 켜짐' : '🔇 소리 꺼짐';

    if(soundOn) ctx();          // 효과음 + 배경음악 함께 켜기
    else bgmStop();             // 함께 끄기

  /* ── 초성 분해 ── */
  function choseongOf(word){
    let out = '';
    for(const ch of word){
      const c = ch.charCodeAt(0) - 0xAC00;
      if(c < 0 || c > 11171) return null;   // 한글 음절이 아님
      out += CHO_LIST[Math.floor(c / 588)];
    }
    return out;
  }

  /* ── 음성 인식 (푸시투톡: 「정답 외치기」를 누른 뒤 한 문장만 듣는다) ── */
  let listening = false;
  let listenEndHook = null;   // 듣기가 스스로 끝났을 때 호출 (3힌트 퀴즈의 카운트다운 재개용)

  function listenOnce(onFinal){
    if(!SR || !micOn || listening) return;
    stopRecogOnly();
    recog = new SR();
    recog.lang = 'ko-KR';
    recog.continuous = false;
    recog.interimResults = true;
    recog.onresult = e => {
      let interim = '';
      for(let i = e.resultIndex; i < e.results.length; i++){
        const r = e.results[i];
        if(r.isFinal) onFinal(r[0].transcript);
        else interim += r[0].transcript;
      }
      if(interim) heard.textContent = '“' + interim.trim() + '”';
    };
    recog.onerror = e => {
      if(e.error === 'aborted') return;
      if(e.error === 'no-speech'){
        showVerdict('✗ 아무 말도 들리지 않았어요 — 버튼을 누르고 다시 외쳐 보세요', 'bad');
        return;
      }
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        micOn = false;
        micBtn.textContent = '🎤 마이크 권한 필요';
        micBtn.setAttribute('aria-pressed','false');
        return;
      }
      const msg = {
        'audio-capture': '마이크를 찾을 수 없어요 — 마이크 연결을 확인하세요',
        'network': '음성 인식 서버 연결 실패 — 인터넷 연결을 확인하세요',
        'language-not-supported': '이 브라우저는 한국어 음성 인식을 지원하지 않아요 — Chrome으로 열어 보세요'
      }[e.error] || ('음성 인식 오류: ' + e.error);
      showVerdict('✗ ' + msg, 'bad');
    };
    recog.onend = () => {
      listening = false;
      recog = null;
      bgmDuck(false);
      updateSpeakUI();
      if(listenEndHook) listenEndHook();
    };
    listening = true;
    bgmDuck(true);   // 듣는 동안 배경음악을 줄여 인식 방해 방지
    updateSpeakUI();
    try{ recog.start(); }
    catch(err){ listening = false; recog = null; bgmDuck(false); updateSpeakUI(); }
  }
  function stopRecogOnly(){
    if(recog){
      recog.onend = null;
      recog.onresult = null;
      try{ if(recog.abort) recog.abort(); else recog.stop(); }catch(err){}
      recog = null;
    }
    listening = false;
    bgmDuck(false);
  }
  function pauseListening(){
    answerActive = false;
    heard.textContent = '';
    listenRow.hidden = true;
  }
  function updateSpeakUI(){
    listenRow.hidden = !listening;
    if(listening){
      micPill.textContent = '듣는 중 — 정답을 외치세요!';
      micPill.className = 'micPill';
      heard.textContent = '';
    }
    const sb = document.getElementById('speakBtn');
    if(sb){
      sb.classList.toggle('listening', listening);
      sb.textContent = listening ? '👂 듣는 중…' : '🎤 정답 외치기';
    }
  }
  /* 정답 외치기 버튼 공통 배선 — 누르면 듣기 시작, 듣는 중에 다시 누르면 취소 */
  function wireSpeakBtn(onFinal, onStartListen){
    const sb = document.getElementById('speakBtn');
    if(!sb) return;
    sb.addEventListener('click', () => {
      ctx();
      if(listening){
        stopRecogOnly();
        updateSpeakUI();
        if(listenEndHook) listenEndHook();   // 듣기 취소 시에도 카운트다운 재개
        return;
      }
      if(onStartListen) onStartListen();
      listenOnce(onFinal);
    });
  }

  /* ── 판정 ── */
  function judge(word){
    const cho = choseongOf(word);
    if(cho === null || word.length === 0) return {res:'skip'};
    if(mode === 2 && word.length < 2) return {res:'wrong', word};
    const need = (mode === 1) ? 1 : 2;
    if(cho.slice(0, need) !== target) return {res:'wrong', word};
    if(answers.some(a => a.word === word)) return {res:'dup', word};
    return {res:'ok', word};
  }

  function handleUtterance(transcript){
    if(!answerActive) return;
    heard.textContent = '“' + transcript.trim() + '”';
    const tokens = transcript.split(/\s+/)
      .map(t => t.replace(/[^가-힣]/g, ''))
      .filter(t => t.length > 0);
    if(tokens.length === 0) return;

    let lastFail = null;
    for(const t of tokens){
      const j = judge(t);
      if(j.res === 'ok'){
        accept(t);
        return;
      }
      if(j.res !== 'skip') lastFail = j;
    }
    if(lastFail) reject(lastFail);
  }

  function accept(word){
    answers.unshift({word, cho: target});
    renderAnswers();
    chimePass();
    showVerdict('✓ 통과! 「' + word + '」', 'ok');
    askTeam(1);
  }
  function reject(j){
    buzzFail();
    if(j.res === 'dup') showVerdict('✗ 「' + j.word + '」 — 이미 나온 단어예요', 'bad');
    else showVerdict('✗ 「' + j.word + '」 — 초성이 맞지 않아요', 'bad');
  }
  function showVerdict(msg, cls){
    clearTimeout(verdictTimer);
    verdictEl.textContent = msg;
    verdictEl.className = 'verdict ' + cls;
    verdictTimer = setTimeout(() => {
      verdictEl.textContent = '';
      verdictEl.className = 'verdict';
    }, 3000);
  }

  /* ── 팝업 공통 (열기/닫기) ── */
  document.querySelectorAll('.modalClose').forEach(b => {
    b.addEventListener('click', () => {
      document.getElementById(b.dataset.close).hidden = true;
    });
  });
  document.querySelectorAll('.modal').forEach(m => {
    m.addEventListener('click', e => { if(e.target === m) m.hidden = true; });
  });

  /* ── 팀 점수판 (팝업) ── */
  const scoreModal = document.getElementById('scoreModal');
  const scores = { A: 0, B: 0 };

  document.getElementById('scoreTog').addEventListener('click', () => {
    scoreModal.hidden = false;
  });

  function renderScore(team){
    const el = document.getElementById('score' + team);
    el.textContent = scores[team];
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  scoreModal.addEventListener('click', e => {
    const b = e.target.closest('.sBtn');
    if(!b) return;
    const t = b.dataset.team;
    scores[t] = Math.max(0, scores[t] + parseInt(b.dataset.d, 10));
    renderScore(t);
    if(soundOn){ ctx(); tone(b.dataset.d > 0 ? 988 : 494, 0, 0.1, 0.14); }
  });

  document.getElementById('scoreReset').addEventListener('click', () => {
    scores.A = 0; scores.B = 0;
    renderScore('A'); renderScore('B');
  });

  /* ── 정답 팀 선택 → 자동 점수 반영 ── */
  const teamPick = document.getElementById('teamPick');
  const teamPickLabel = document.getElementById('teamPickLabel');
  const TEAM_NAMES = { A:'창희 없는 창희팀', B:'수연 없는 수연팀' };
  let pendingPts = 0;

  function askTeam(pts){
    pendingPts = pts;
    teamPickLabel.textContent = '+' + pts + '점 — 어느 팀이 맞췄나요?';
    teamPick.hidden = false;
  }
  function hideTeamPick(){
    teamPick.hidden = true;
  }
  teamPick.addEventListener('click', e => {
    const b = e.target.closest('button');
    if(!b) return;
    hideTeamPick();
    const t = b.dataset.team;
    if(t === 'A' || t === 'B'){
      scores[t] += pendingPts;
      renderScore(t);
      chimePass();
      showVerdict('🏆 ' + TEAM_NAMES[t] + ' +' + pendingPts + '점! (현재 ' + scores[t] + '점)', 'ok');
    }
  });

  /* ── 타이머 (팝업) ── */
  const timerModal = document.getElementById('timerModal');
  const timerDisp  = document.getElementById('timerDisp');
  const timerStart = document.getElementById('timerStartBtn');
  let timerTotal = 60, timerLeft = 60, timerInt = null;

  document.getElementById('timerTog').addEventListener('click', () => {
    timerModal.hidden = false;
  });

  function fmtTime(s){
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }
  function timerRender(){
    timerDisp.textContent = fmtTime(timerLeft);
    timerDisp.classList.toggle('danger', timerInt !== null && timerLeft <= 10);
  }
  function timerStop(){
    clearInterval(timerInt);
    timerInt = null;
    timerStart.textContent = timerLeft === timerTotal ? '시 작' : '계 속';
  }
  function timerFinish(){
    clearInterval(timerInt);
    timerInt = null;
    timerLeft = 0;
    timerDisp.textContent = fmtTime(0);
    timerDisp.classList.remove('danger');
    timerDisp.classList.remove('done');
    void timerDisp.offsetWidth;
    timerDisp.classList.add('done');
    timerStart.textContent = '시 작';
    timerModal.hidden = false;   // 닫혀 있었다면 종료 시점에 다시 띄운다
    if(soundOn){
      ctx();
      tone(1046.5, 0,   0.18, 0.3);
      tone(1046.5, 0.25, 0.18, 0.3);
      tone(1046.5, 0.5,  0.45, 0.3);
    }
  }
  timerStart.addEventListener('click', () => {
    ctx();
    if(timerInt !== null){   // 실행 중 → 일시정지
      timerStop();
      return;
    }
    if(timerLeft <= 0) timerLeft = timerTotal;
    timerDisp.classList.remove('done');
    timerStart.textContent = '일시정지';
    timerInt = setInterval(() => {
      timerLeft--;
      if(timerLeft <= 0){ timerFinish(); return; }
      timerRender();
      if(soundOn && timerLeft <= 3) tone(880, 0, 0.1, 0.15);
    }, 1000);
    timerRender();
  });
  document.getElementById('timerResetBtn').addEventListener('click', () => {
    clearInterval(timerInt);
    timerInt = null;
    timerLeft = timerTotal;
    timerDisp.classList.remove('done');
    timerStart.textContent = '시 작';
    timerRender();
  });
  document.getElementById('timerPresets').addEventListener('click', e => {
    const b = e.target.closest('button[data-sec]');
    if(!b) return;
    document.querySelectorAll('#timerPresets button').forEach(x =>
      x.setAttribute('aria-pressed', String(x === b)));
    clearInterval(timerInt);
    timerInt = null;
    timerTotal = parseInt(b.dataset.sec, 10);
    timerLeft = timerTotal;
    timerDisp.classList.remove('done');
    timerStart.textContent = '시 작';
    timerRender();
  });

  /* ── 게임 전환 ── */
  let gameMode = 'cho';   // 'cho' | 'tel' | 'emo'
  function setGame(g){
    if(running || g === gameMode) return;
    gameMode = g;
    hideTeamPick();
    hintTimerClear();
    listenEndHook = null;
    gameChoBtn.setAttribute('aria-pressed', String(g === 'cho'));
    gameTelBtn.setAttribute('aria-pressed', String(g === 'tel'));
    gameEmoBtn.setAttribute('aria-pressed', String(g === 'emo'));
    gameHintBtn.setAttribute('aria-pressed', String(g === 'hint'));
    choModesEl.hidden = g !== 'cho';
    telModesEl.hidden = g !== 'tel';
    emoModesEl.hidden = g !== 'emo';
    hintModesEl.hidden = g !== 'hint';
    micBtn.hidden = g === 'tel';
    answersRow.hidden = g !== 'cho';
    if(g === 'cho'){
      renderAnswers();
      resetStage();
    } else {
      pauseListening();
      stopRecogOnly();
      if(g === 'tel') telReset();
      else if(g === 'emo') emoReset();
      else hintReset();
    }
  }
  gameChoBtn.addEventListener('click', () => setGame('cho'));
  gameTelBtn.addEventListener('click', () => setGame('tel'));
  gameEmoBtn.addEventListener('click', () => setGame('emo'));
  gameHintBtn.addEventListener('click', () => setGame('hint'));

  /* ── 이모지 퀴즈 ── */
  let emoCat = 'movie';
  let emoDeck = [];
  let emoItem = null;

  emoModesEl.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      emoCat = b.dataset.cat;
      emoModesEl.querySelectorAll('button').forEach(x =>
        x.setAttribute('aria-pressed', String(x === b)));
      emoDeck = [];
      emoReset();
    });
  });

  function emoDraw(){
    if(emoDeck.length === 0){
      emoDeck = EMOJI_QUIZ[emoCat].slice();
      for(let i = emoDeck.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [emoDeck[i], emoDeck[j]] = [emoDeck[j], emoDeck[i]];
      }
    }
    emoItem = emoDeck.pop();
  }

  /* 제목 비교용 정규화 — 공백·기호를 지우고 소문자로 */
  function normTitle(s){
    return s.toLowerCase().replace(/[^가-힣a-z0-9]/g, '');
  }
  function titleMatch(transcript, item){
    const t = normTitle(transcript);
    if(!t) return false;
    const targets = [item.a].concat(item.al || []).map(normTitle);
    return targets.some(a =>
      a.length > 0 && (t.includes(a) || (a.includes(t) && t.length >= Math.ceil(a.length / 2))));
  }
  function checkEmoAnswer(transcript){
    heard.textContent = '“' + transcript.trim() + '”';
    if(!normTitle(transcript)) return;
    if(titleMatch(transcript, emoItem)){
      stopRecogOnly();
      showVerdict('✓ 정답!', 'ok');
      emoAnswer();
    } else {
      buzzFail();
      showVerdict('✗ 땡! 「정답 외치기」를 누르고 다시 도전해 보세요', 'bad');
    }
  }

  function emoQuestion(){
    ctx();
    stopRecogOnly();
    hideTeamPick();
    emoDraw();
    big.className = 'big emoji';
    big.textContent = emoItem.e;
    chimeReveal();
    hint.innerHTML = '이 이모지가 표현하는 <b>' + EMO_CAT_NAMES[emoCat] + '</b> 제목은?<br>「정답 외치기」를 누르고 정답을 외치면 맞을 경우 자동으로 공개됩니다!';
    actions.innerHTML =
      (SR ? '<button class="btn btn-speak" id="speakBtn">🎤 정답 외치기</button>' : '') +
      '<button class="btn btn-next" id="emoAnswerBtn">정답 공개</button>' +
      '<button class="btn btn-reset" id="emoHomeBtn">처음으로</button>';
    wireSpeakBtn(checkEmoAnswer);
    document.getElementById('emoAnswerBtn').addEventListener('click', emoAnswer);
    document.getElementById('emoHomeBtn').addEventListener('click', emoReset);
  }

  function emoAnswer(){
    stopRecogOnly();
    listenRow.hidden = true;
    big.className = 'big word title';
    big.textContent = emoItem.a;
    chimePass();
    hint.innerHTML = emoItem.e + '<br>맞춘 팀을 선택하면 1점이 자동으로 올라갑니다!';
    askTeam(1);
    actions.innerHTML =
      '<button class="btn btn-start" id="emoNextBtn">다음 문제</button>' +
      '<button class="btn btn-reset" id="emoHomeBtn2">처음으로</button>';
    document.getElementById('emoNextBtn').addEventListener('click', emoQuestion);
    document.getElementById('emoHomeBtn2').addEventListener('click', emoReset);
  }

  function emoReset(){
    stopRecogOnly();
    hideTeamPick();
    listenRow.hidden = true;
    big.className = 'big';
    big.textContent = '';
    verdictEl.textContent = '';
    verdictEl.className = 'verdict';
    hint.innerHTML = '「문제 뽑기」를 누르면 <b>' + EMO_CAT_NAMES[emoCat] + '</b> 제목을 표현한 이모지 문제가 나옵니다.<br>다 함께 보고 정답을 외쳐 보세요!';
    actions.innerHTML = '<button class="btn btn-start" id="emoDrawBtn">문제 뽑기</button>';
    document.getElementById('emoDrawBtn').addEventListener('click', emoQuestion);
  }

  /* ── 3힌트 퀴즈 ── */
  let hintCat = 'person';
  let hintDeck = [];
  let hintItem = null;
  let hintShown = 1;

  /* 10초 안에 정답 외치기를 누르지 않으면 자동으로 다음 힌트 */
  const hintTimerBadge = document.getElementById('hintTimerBadge');
  const hintTimerNum = document.getElementById('hintTimerNum');
  let hintTimerInt = null;
  let hintTimerLeft = 10;

  function hintTimerStart(){
    hintTimerStop();
    if(hintShown >= 3){ hintTimerBadge.hidden = true; return; }
    hintTimerLeft = 10;
    hintTimerNum.textContent = hintTimerLeft;
    hintTimerBadge.hidden = false;
    hintTimerInt = setInterval(() => {
      hintTimerLeft--;
      if(hintTimerLeft <= 0){
        hintMore();   // hintMore가 카운트다운을 다시 시작한다
      } else {
        hintTimerNum.textContent = hintTimerLeft;
      }
    }, 1000);
  }
  function hintTimerStop(){
    clearInterval(hintTimerInt);
    hintTimerInt = null;
  }
  function hintTimerClear(){
    hintTimerStop();
    hintTimerBadge.hidden = true;
  }

  hintModesEl.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      hintCat = b.dataset.cat;
      hintModesEl.querySelectorAll('button').forEach(x =>
        x.setAttribute('aria-pressed', String(x === b)));
      hintDeck = [];
      hintReset();
    });
  });

  function hintDraw(){
    if(hintDeck.length === 0){
      hintDeck = HINT_QUIZ[hintCat].slice();
      for(let i = hintDeck.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [hintDeck[i], hintDeck[j]] = [hintDeck[j], hintDeck[i]];
      }
    }
    hintItem = hintDeck.pop();
  }

  function renderHintLines(){
    big.className = 'big hintbox';
    big.innerHTML = hintItem.h.slice(0, hintShown)
      .map((h, i) => '<div><span class="hLabel">힌트' + (i + 1) + '</span>' + h + '</div>')
      .join('');
  }

  function hintQuestion(){
    ctx();
    stopRecogOnly();
    hideTeamPick();
    hintDraw();
    hintShown = 1;
    renderHintLines();
    chimeReveal();
    hint.innerHTML = '이 <b>' + HINT_CAT_NAMES[hintCat] + '</b>은(는) 무엇일까요? 힌트가 적을 때 맞출수록 고득점!<br>(힌트 1개 = 3점 · 2개 = 2점 · 3개 = 1점)';
    actions.innerHTML =
      (SR ? '<button class="btn btn-speak" id="speakBtn">🎤 정답 외치기</button>' : '') +
      '<button class="btn btn-next" id="hintMoreBtn">힌트 더 보기</button>' +
      '<button class="btn btn-reset" id="hintAnswerBtn">정답 공개</button>' +
      '<button class="btn btn-reset" id="hintHomeBtn">처음으로</button>';
    wireSpeakBtn(checkHintAnswer, hintTimerStop);   // 듣는 동안 카운트다운 일시정지
    listenEndHook = hintTimerStart;                  // 듣기가 끝나면 카운트다운 재개
    document.getElementById('hintMoreBtn').addEventListener('click', hintMore);
    document.getElementById('hintAnswerBtn').addEventListener('click', hintAnswer);
    document.getElementById('hintHomeBtn').addEventListener('click', hintReset);
    hintTimerStart();
  }

  function hintMore(){
    if(hintShown >= 3) return;
    hintShown++;
    renderHintLines();
    if(soundOn){ ctx(); tone(660, 0, 0.12, 0.15); }
    if(hintShown >= 3){
      const mb = document.getElementById('hintMoreBtn');
      if(mb){ mb.disabled = true; mb.style.opacity = '.4'; }
      hintTimerClear();
    } else {
      hintTimerStart();
    }
  }

  function checkHintAnswer(transcript){
    heard.textContent = '“' + transcript.trim() + '”';
    if(!normTitle(transcript)) return;
    if(titleMatch(transcript, hintItem)){
      const pts = 4 - hintShown;
      listenEndHook = null;
      stopRecogOnly();
      showVerdict('✓ 정답! (힌트 ' + hintShown + '개 → ' + pts + '점)', 'ok');
      hintAnswer();
    } else {
      buzzFail();
      showVerdict('✗ 땡! 힌트를 더 보거나 다시 도전해 보세요', 'bad');
    }
  }

  function hintAnswer(){
    listenEndHook = null;
    hintTimerClear();
    stopRecogOnly();
    listenRow.hidden = true;
    big.className = 'big word title';
    big.textContent = hintItem.a;
    chimePass();
    hint.innerHTML = '힌트 ' + hintShown + '개 만에 공개! 맞춘 팀을 선택하면 <b>' + (4 - hintShown) + '점</b>이 자동으로 올라갑니다 🏆';
    actions.innerHTML =
      '<button class="btn btn-start" id="hintNextBtn">다음 문제</button>' +
      '<button class="btn btn-reset" id="hintHomeBtn2">처음으로</button>';
    document.getElementById('hintNextBtn').addEventListener('click', hintQuestion);
    document.getElementById('hintHomeBtn2').addEventListener('click', hintReset);
    askTeam(4 - hintShown);
  }

  function hintReset(){
    listenEndHook = null;
    hintTimerClear();
    hideTeamPick();
    stopRecogOnly();
    listenRow.hidden = true;
    big.className = 'big';
    big.textContent = '';
    verdictEl.textContent = '';
    verdictEl.className = 'verdict';
    hint.innerHTML = '「문제 뽑기」를 누르면 <b>' + HINT_CAT_NAMES[hintCat] + '</b> 문제의 첫 번째 힌트가 공개됩니다.<br>10초 안에 정답 외치기를 누르지 않으면 자동으로 다음 힌트가 공개돼요! (3점 → 2점 → 1점)';
    actions.innerHTML = '<button class="btn btn-start" id="hintDrawBtn">문제 뽑기</button>';
    document.getElementById('hintDrawBtn').addEventListener('click', hintQuestion);
  }

  /* ── 텔레스트레이션 ── */
  let telLevel = 'easy';
  let telDeck = [];
  let telWord = null;
  let telPrev = null;

  telModesEl.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      telLevel = b.dataset.level;
      telModesEl.querySelectorAll('button').forEach(x =>
        x.setAttribute('aria-pressed', String(x === b)));
      telDeck = [];
      telReset();
    });
  });

  function telDraw(){
    if(telDeck.length === 0){
      telDeck = TEL_WORDS[telLevel].slice();
      for(let i = telDeck.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [telDeck[i], telDeck[j]] = [telDeck[j], telDeck[i]];
      }
      /* 새로 섞은 덱의 첫 카드가 직전 단어와 겹치지 않게 */
      if(telDeck.length > 1 && telDeck[telDeck.length - 1] === telPrev){
        telDeck.unshift(telDeck.pop());
      }
    }
    telWord = telDeck.pop();
    telPrev = telWord;
  }

  function telReady(){
    ctx();
    telDraw();
    big.className = 'big qmark';
    big.textContent = '?';
    if(soundOn) tone(660, 0, 0.15, 0.18);
    hint.innerHTML = '그리는 사람만 <b>단어 확인</b>을 누르세요!<br>다른 사람은 화면을 보면 안 돼요 🙈';
    actions.innerHTML =
      '<button class="btn btn-start" id="telRevealBtn">단어 확인</button>' +
      '<button class="btn btn-reset" id="telHomeBtn">처음으로</button>';
    document.getElementById('telRevealBtn').addEventListener('click', telReveal);
    document.getElementById('telHomeBtn').addEventListener('click', telReset);
  }

  function telReveal(){
    big.className = 'big word';
    big.textContent = telWord;
    chimeReveal();
    hint.innerHTML = '이 단어를 <b>그림으로만</b> 표현하세요! (글자·숫자 금지)<br>다 그렸으면 스케치북을 다음 사람에게 넘기세요';
    actions.innerHTML =
      '<button class="btn btn-next" id="telNextBtn">다음 카드</button>' +
      '<button class="btn btn-reset" id="telHomeBtn2">처음으로</button>';
    document.getElementById('telNextBtn').addEventListener('click', () => {
      askTeam(1);   // 한 바퀴 끝 — 맞춘 팀에 점수를 주고 다음 카드로
      telReady();
    });
    document.getElementById('telHomeBtn2').addEventListener('click', telReset);
  }

  function telReset(){
    hideTeamPick();
    big.className = 'big';
    big.textContent = '';
    verdictEl.textContent = '';
    verdictEl.className = 'verdict';
    hint.innerHTML = '「카드 뽑기」를 누르면 <b>' + TEL_LEVEL_NAMES[telLevel] + '</b> 난이도의 단어 카드가 준비됩니다.<br>그림 → 추측 → 그림으로 이어지는 텔레스트레이션을 즐겨 보세요!';
    actions.innerHTML = '<button class="btn btn-start" id="telDrawBtn">카드 뽑기</button>';
    document.getElementById('telDrawBtn').addEventListener('click', telReady);
  }

  /* ── 모드 ── */
  function setMode(m){
    if(running) return;
    mode = m;
    mode1Btn.setAttribute('aria-pressed', String(m === 1));
    mode2Btn.setAttribute('aria-pressed', String(m === 2));
    resetStage();
  }
  mode1Btn.addEventListener('click', () => setMode(1));
  mode2Btn.addEventListener('click', () => setMode(2));

  /* ── 뽑기 ── */
  function rand(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
  function pickJamo(){
    let pick;
    do {
      pick = (mode === 1) ? rand(JAMO) : rand(JAMO) + rand(JAMO);
    } while (pick === lastPick);
    lastPick = pick;
    return pick;
  }

  /* ── 진행 ── */
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function flashRing(){
    ring.classList.remove('go');
    void ring.offsetWidth;
    ring.classList.add('go');
  }

  async function round(){
    if(running) return;
    running = true;
    pauseListening();
    stopRecogOnly();
    hideTeamPick();
    answers = [];          // 새 초성마다 정답 리스트 리셋
    renderAnswers();
    mode1Btn.disabled = mode2Btn.disabled = true;
    hint.textContent = '';
    verdictEl.textContent = '';
    verdictEl.className = 'verdict';
    actions.innerHTML = '';

    const colors = ['', 'n1', 'n2', ''];
    for(let n = 3; n >= 1; n--){
      big.className = 'big count ' + colors[n];
      big.textContent = n;
      ring.style.color = getComputedStyle(big).color;
      flashRing();
      beepCount();
      void big.offsetWidth;
      await sleep(1000);
    }

    target = pickJamo();
    big.className = 'big jamo' + (mode === 2 ? ' two' : '');
    big.textContent = target;
    chimeReveal();

    hint.textContent = (mode === 1)
      ? '「정답 외치기」를 누르고 이 초성으로 시작하는 단어를 외치세요!'
      : '「정답 외치기」를 누르고 앞 두 글자의 초성이 일치하는 단어를 외치세요!';

    answerActive = true;

    actions.innerHTML =
      (SR ? '<button class="btn btn-speak" id="speakBtn">🎤 정답 외치기</button>' : '') +
      '<button class="btn btn-next" id="nextBtn">다 음</button>' +
      '<button class="btn btn-reset" id="resetBtn">처음으로</button>';
    wireSpeakBtn(handleUtterance);
    document.getElementById('nextBtn').addEventListener('click', () => {
      running = false; lockModes(false);
      round();
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      running = false;
      answers = [];
      lastPick = null;
      renderAnswers();
      resetStage();
    });

    running = false;
    lockModes(false);
  }

  function lockModes(lock){
    mode1Btn.disabled = mode2Btn.disabled = lock;
  }

  function renderAnswers(){
    answerCount.textContent = answers.length ? answers.length + '개' : '';
    chips.innerHTML = answers.length
      ? answers.map((a, i) =>
          '<span class="chip' + (i === 0 ? ' latest' : '') + '">' + a.word + '</span>').join('')
      : '<span class="chip placeholder">정답을 외치면 여기에 쌓여요</span>';
  }
  renderAnswers();

  function resetStage(){
    pauseListening();
    hideTeamPick();
    big.className = 'big';
    big.textContent = '';
    verdictEl.textContent = '';
    verdictEl.className = 'verdict';
    hint.innerHTML = (mode === 1)
      ? '시작 버튼을 누르면 3초 카운트다운 후 랜덤 초성이 공개됩니다.<br>초성이 나오면 단어를 외치세요 - 정답 시 하단에 리스트가 쌓입니다!'
      : '시작 버튼을 누르면 3초 카운트다운 후 랜덤 초성 <b>두 글자</b>가 공개됩니다.<br>초성이 나오면 단어를 외치세요 - 정답 시 하단에 리스트가 쌓입니다!';
    actions.innerHTML = '<button class="btn btn-start" id="startBtn">시 작</button>';
    document.getElementById('startBtn').addEventListener('click', () => {
      ctx();
      round();
    });
    lockModes(false);
  }

  resetStage();
</script>

</html>

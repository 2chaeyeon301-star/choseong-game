<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="파티 룰렛">
<link rel="apple-touch-icon" href="icon.png">
<title>파티 룰렛</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
  :root{
    --ground:#1A1040;
    --ground-deep:#120A2E;
    --panel:#261A57;
    --panel-edge:#3A2A7A;
    --amber:#FFC93C;
    --pink:#FF5C8A;
    --mint:#4EE6B8;
    --text:#F5F1FF;
    --text-dim:#B9AEE0;
    --display:'Black Han Sans', 'Noto Sans KR', sans-serif;
    --body:'Gowun Dodum', 'Noto Sans KR', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #2E1E66 0%, var(--ground) 55%, var(--ground-deep) 100%);
    color:var(--text);
    font-family:var(--body);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    min-height:100svh;   /* iOS Safari 툴바를 제외한 실제 보이는 높이 */
    padding:24px 16px 32px;
  }
  @media (max-width:700px){
    body{padding:12px 10px 20px;}
  }

  /* ── 헤더 ─────────────────────────── */
  header{
    width:100%;
    max-width:860px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand h1{
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(24px, 4vw, 32px);
    letter-spacing:1px;
    color:var(--text);
  }
  .brand h1 .dot{color:var(--pink);}
  .brand .tag{
    font-size:13px;
    color:var(--text-dim);
    letter-spacing:2px;
  }
  .headBtns{display:flex; gap:8px;}
  .pillBtn{
    background:var(--panel);
    border:1px solid var(--panel-edge);
    color:var(--text);
    border-radius:999px;
    padding:8px 16px;
    font-family:var(--body);
    font-size:14px;
    cursor:pointer;
    transition:background .15s;
  }
  .pillBtn:hover{background:var(--panel-edge);}
  .pillBtn:focus-visible{outline:2px solid var(--mint); outline-offset:2px;}
  .pillBtn[aria-pressed="false"]{color:var(--text-dim);}

  /* ── 탭 줄 (게임 선택 + 모드/난이도 좌우 배치) ── */
  .tabsRow{
    margin-top:16px;
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;      /* 화면이 좁으면 자동 줄바꿈 */
    max-width:100%;
  }

  /* ── 게임 선택 탭 ────────────────────── */
  .gameTabs{
    display:flex;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:999px;
    padding:6px;
  }
  .gameTabs button{
    border:0;
    background:transparent;
    color:var(--text-dim);
    font-family:var(--body);
    font-size:15px;
    padding:10px 24px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .gameTabs button[aria-pressed="true"]{
    background:var(--pink);
    color:#3A0016;
  }
  .gameTabs button:focus-visible{outline:2px solid var(--mint); outline-offset:2px;}
  .gameTabs button:disabled{opacity:.45; cursor:default;}

  /* ── 모드 탭 ─────────────────────────── */
  .modes{
    display:flex;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:999px;
    padding:6px;
  }
  .modes button{
    border:0;
    background:transparent;
    color:var(--text-dim);
    font-family:var(--body);
    font-size:15px;
    padding:10px 22px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .modes button[aria-pressed="true"]{
    background:var(--amber);
    color:#241500;
  }
  .modes button:focus-visible{outline:2px solid var(--mint); outline-offset:2px;}
  .modes button:disabled{opacity:.45; cursor:default;}

  /* ── 무대 ─────────────────────────── */
  .stage{
    margin-top:26px;
    width:100%;
    max-width:860px;
    flex:1;
    min-height:420px;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    position:relative;
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
    padding:24px 16px;
  }
  @media (max-width:700px){
    .stage{min-height:340px; border-radius:20px; gap:10px; margin-top:16px;}
    .btn{font-size:19px; padding:13px 30px;}
    .hint{font-size:14px;}
  }
  /* 화면 높이가 낮은 환경(가로 모드 등) — 버튼까지 한 화면에 들어오도록 축소 */
  @media (max-height:780px){
    body{padding:10px 10px 16px;}
    .tabsRow{margin-top:10px; gap:8px;}
    .gameTabs button, .modes button{padding:8px 14px; font-size:14px;}
    .stage{margin-top:14px; min-height:300px; gap:8px;}
    .bigWrap{height:clamp(96px, 21vh, 190px); padding:6px 0;}
    .big{font-size:clamp(52px, min(30vw, 17vh), 150px);}
    .big.two{font-size:clamp(44px, min(24vw, 17vh), 140px);}
    .hint{font-size:14px; line-height:1.5;}
    .btn{font-size:18px; padding:11px 30px;}
    .btn-reset{padding:11px 18px;}
    .answers{margin-top:12px; min-height:36px;}
    .chips{max-height:50px;}
  }
  .stage::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(520px 320px at 50% 42%, rgba(255,201,60,.10), transparent 70%);
    pointer-events:none;
  }

  /* ── 팀 점수판 ─────────────────────── */
  .scoreboard{
    position:absolute;
    top:12px;
    left:0;
    right:0;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:0 14px;
    z-index:5;
    pointer-events:none;
  }
  .scorePod{
    pointer-events:auto;
    background:var(--ground-deep);
    border:1px solid var(--panel-edge);
    border-radius:16px;
    padding:8px 14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    min-width:76px;
  }
  .scorePod .teamName{font-size:13px; letter-spacing:1px;}
  .scorePod.teamA .teamName{color:var(--amber);}
  .scorePod.teamB .teamName{color:var(--mint);}
  .scoreNum{
    font-family:var(--display);
    font-weight:400;
    font-size:30px;
    line-height:1;
    color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  @keyframes bump{0%{transform:scale(1.45);}100%{transform:scale(1);}}
  .scoreNum.bump{animation:bump .25s ease;}
  .scoreBtns{display:flex; gap:6px; margin-top:4px;}
  .sBtn{
    width:32px; height:32px;
    border-radius:50%;
    border:1px solid var(--panel-edge);
    background:var(--panel);
    color:var(--text);
    font-size:17px;
    line-height:1;
    cursor:pointer;
  }
  .sBtn.plus{border-color:rgba(78,230,184,.55); color:var(--mint);}
  .sBtn.minus{color:var(--text-dim);}
  .sBtn:active{transform:scale(.88);}
  .sBtn:focus-visible{outline:2px solid var(--mint); outline-offset:2px;}
  .scoreReset{
    pointer-events:auto;
    background:transparent;
    border:0;
    color:var(--text-dim);
    font-size:18px;
    cursor:pointer;
    padding:6px 10px;
  }
  .scoreReset:hover{color:var(--text);}
  @media (max-height:780px){
    .scoreNum{font-size:24px;}
    .scorePod{padding:6px 10px; min-width:64px;}
    .sBtn{width:27px; height:27px; font-size:15px;}
  }
  @media (prefers-reduced-motion: reduce){
    .scoreNum.bump{animation:none;}
  }

  .hint{
    color:var(--text-dim);
    font-size:16px;
    text-align:center;
    line-height:1.7;
    max-width:34em;
    padding:0 20px;
  }

  /* 대형 표시 영역 */
  .bigWrap{
    height:clamp(125px, 28vh, 280px);
    padding:10px 0;
    max-width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .big{
    font-family:var(--display);
    font-weight:400;
    line-height:1.1;
    /* 가로·세로 어느 쪽도 넘치지 않게 — 두 글자 모드(글자 2개)를 기준으로 가로 제한 */
    font-size:clamp(64px, min(38vw, 22vh), 200px);
    letter-spacing:.04em;
    user-select:none;
    white-space:nowrap;
  }
  .big.two{font-size:clamp(56px, min(30vw, 22vh), 180px);}
  .big.count{color:var(--amber);}
  .big.count.n2{color:var(--mint);}
  .big.count.n1{color:var(--pink);}
  .big.jamo{
    color:var(--pink);
    text-shadow:0 0 60px rgba(255,92,138,.45);
  }
  /* 이모지 퀴즈 문제 */
  .big.emoji{
    font-size:clamp(38px, min(12vw, 11vh), 88px);
    letter-spacing:.08em;
    white-space:nowrap;
    text-shadow:none;
  }
  /* 텔레스트레이션 단어 카드 */
  .big.word{
    font-size:clamp(40px, min(15vw, 13vh), 104px);
    color:var(--mint);
    text-shadow:0 0 50px rgba(78,230,184,.4);
    white-space:nowrap;
  }
  .big.qmark{
    color:var(--amber);
    text-shadow:0 0 50px rgba(255,201,60,.4);
  }
  /* 이모지 퀴즈 정답 — 긴 제목도 줄바꿈되며 화면 안에 들어오게 */
  .big.title{
    font-size:clamp(28px, min(9vw, 9vh), 72px);
    white-space:normal;
    text-align:center;
    line-height:1.25;
    max-width:92vw;
  }

  @keyframes pop{
    0%  {transform:scale(2.2); opacity:0;}
    55% {transform:scale(.95); opacity:1;}
    100%{transform:scale(1);   opacity:1;}
  }
  @keyframes reveal{
    0%  {transform:scale(.3) rotate(-6deg); opacity:0;}
    60% {transform:scale(1.12) rotate(2deg); opacity:1;}
    100%{transform:scale(1) rotate(0);      opacity:1;}
  }
  .big.count, .big.qmark{animation:pop .9s cubic-bezier(.2,.9,.3,1) both;}
  .big.jamo, .big.word, .big.emoji{animation:reveal .55s cubic-bezier(.2,.9,.3,1.2) both;}

  .ring{
    position:absolute;
    width:clamp(220px, 36vh, 340px);
    height:clamp(220px, 36vh, 340px);
    border-radius:50%;
    border:3px solid currentColor;
    opacity:0;
    pointer-events:none;
  }
  @keyframes ringOut{
    0%  {transform:scale(.6); opacity:.7;}
    100%{transform:scale(1.25); opacity:0;}
  }
  .ring.go{animation:ringOut .85s ease-out both;}

  /* ── 듣기 상태 / 판정 ─────────────────── */
  .listen{
    display:flex;
    align-items:center;
    gap:10px;
    min-height:32px;
  }
  .micPill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(78,230,184,.12);
    border:1px solid rgba(78,230,184,.4);
    color:var(--mint);
    border-radius:999px;
    padding:6px 14px;
    font-size:14px;
  }
  .micPill::before{
    content:"";
    width:8px; height:8px;
    border-radius:50%;
    background:var(--mint);
    animation:blink 1.2s ease-in-out infinite;
  }
  .micPill.off{
    color:var(--text-dim);
    border-color:var(--panel-edge);
    background:transparent;
  }
  .micPill.off::before{background:var(--text-dim); animation:none;}
  @keyframes blink{0%,100%{opacity:1;} 50%{opacity:.25;}}
  .heard{
    color:var(--text-dim);
    font-size:15px;
    max-width:26em;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .verdict{
    min-height:30px;
    font-size:19px;
    text-align:center;
  }
  .verdict.ok{color:var(--mint);}
  .verdict.bad{color:var(--pink); animation:shake .35s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-7px);}
    50%{transform:translateX(7px);}
    75%{transform:translateX(-4px);}
  }

  @media (prefers-reduced-motion: reduce){
    .big.count, .big.jamo, .big.qmark, .big.word, .big.emoji{animation:none;}
    .ring.go{animation:none; opacity:0;}
    .micPill::before{animation:none;}
    .verdict.bad{animation:none;}
  }

  /* ── 직접 입력 ─────────────────────── */
  .typeForm{
    display:flex;
    gap:8px;
  }
  .typeForm input{
    background:var(--ground-deep);
    border:1px solid var(--panel-edge);
    border-radius:12px;
    color:var(--text);
    font-family:var(--body);
    font-size:16px;
    padding:10px 16px;
    width:min(280px, 60vw);
  }
  .typeForm input::placeholder{color:var(--text-dim); opacity:.7;}
  .typeForm input:focus-visible{outline:2px solid var(--mint); outline-offset:1px;}
  .typeForm button{
    background:var(--panel-edge);
    border:0;
    border-radius:12px;
    color:var(--text);
    font-family:var(--body);
    font-size:15px;
    padding:10px 18px;
    cursor:pointer;
  }
  .typeForm button:hover{filter:brightness(1.2);}
  .typeForm button:focus-visible{outline:2px solid var(--mint); outline-offset:2px;}

  /* ── 버튼 ─────────────────────────── */
  .actions{display:flex; gap:14px;}
  .btn{
    font-family:var(--display);
    font-weight:400;
    font-size:22px;
    letter-spacing:2px;
    border:0;
    border-radius:18px;
    padding:16px 44px;
    cursor:pointer;
    transition:transform .12s, filter .15s;
  }
  .btn:hover{filter:brightness(1.1); transform:translateY(-2px);}
  .btn:active{transform:translateY(0) scale(.97);}
  .btn:focus-visible{outline:3px solid var(--mint); outline-offset:3px;}
  .btn-start{
    background:linear-gradient(180deg, #FFD75E, var(--amber));
    color:#241500;
    box-shadow:0 10px 30px rgba(255,201,60,.30);
  }
  .btn-next{
    background:linear-gradient(180deg, #FF7CA0, var(--pink));
    color:#3A0016;
    box-shadow:0 10px 30px rgba(255,92,138,.30);
  }
  .btn-reset{
    background:transparent;
    border:1px solid var(--panel-edge);
    color:var(--text-dim);
    font-family:var(--body);
    font-size:15px;
    letter-spacing:0;
    padding:16px 24px;
  }
  .btn-reset:hover{color:var(--text);}

  /* ── 정답 단어 ─────────────────────── */
  .answers{
    margin-top:20px;
    width:100%;
    max-width:860px;
    min-height:44px;
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .answers .label{
    font-size:13px;
    color:var(--text-dim);
    letter-spacing:2px;
    white-space:nowrap;
    padding-top:9px;
  }
  .answers .count{
    color:var(--mint);
    font-size:13px;
    padding-top:9px;
  }
  .chips{
    display:flex; gap:8px; flex-wrap:wrap;
    max-height:88px;          /* 단어가 많아져도 리스트 안에서만 스크롤 — 화면이 밀리지 않게 */
    overflow-y:auto;
  }
  .chip.placeholder{
    color:var(--text-dim);
    border-style:dashed;
    font-size:14px;
  }
  .chip{
    font-family:var(--body);
    font-size:16px;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:12px;
    padding:7px 14px;
  }
  .chip b{
    font-family:var(--display);
    font-weight:400;
    color:var(--text-dim);
    font-size:13px;
    margin-right:6px;
  }
  .chip.latest{border-color:var(--mint); color:var(--mint);}
  .chip.latest b{color:var(--mint);}
</style>

<header>
  <div class="brand">
    <h1>파티 룰렛<span class="dot">.</span></h1>
    <span class="tag">PARTY GAMES</span>
  </div>
  <div class="headBtns">
    <button class="pillBtn" id="scoreTog" aria-pressed="false">🏆 점수판</button>
    <button class="pillBtn" id="micBtn" aria-pressed="true">🎤 음성 인식 켜짐</button>
    <button class="pillBtn" id="soundBtn" aria-pressed="true">🔊 소리 켜짐</button>
  </div>
</header>

<div class="tabsRow">
  <div class="gameTabs" role="group" aria-label="게임 선택">
    <button id="gameCho" aria-pressed="true">🗣️ 초성게임</button>
    <button id="gameTel" aria-pressed="false">🎨 텔레스트레이션</button>
    <button id="gameEmo" aria-pressed="false">🎬 이모지 퀴즈</button>
  </div>
  <div class="modes" id="choModes" role="group" aria-label="초성게임 모드">
    <button id="mode1" aria-pressed="true">초성 한 글자</button>
    <button id="mode2" aria-pressed="false">초성 두 글자</button>
  </div>
  <div class="modes" id="telModes" role="group" aria-label="텔레스트레이션 난이도" hidden>
    <button data-level="easy" aria-pressed="true">쉬움</button>
    <button data-level="normal" aria-pressed="false">보통</button>
    <button data-level="hard" aria-pressed="false">어려움</button>
  </div>
  <div class="modes" id="emoModes" role="group" aria-label="이모지 퀴즈 종류" hidden>
    <button data-cat="movie" aria-pressed="true">영화</button>
    <button data-cat="drama" aria-pressed="false">드라마</button>
  </div>
</div>

<main class="stage" aria-live="polite">
  <div class="scoreboard" id="scoreboard" hidden>
    <div class="scorePod teamA">
      <span class="teamName">A팀</span>
      <span class="scoreNum" id="scoreA">0</span>
      <div class="scoreBtns">
        <button class="sBtn plus" data-team="A" data-d="1" aria-label="A팀 점수 올리기">+</button>
        <button class="sBtn minus" data-team="A" data-d="-1" aria-label="A팀 점수 내리기">−</button>
      </div>
    </div>
    <button class="scoreReset" id="scoreReset" title="점수 초기화">↺</button>
    <div class="scorePod teamB">
      <span class="teamName">B팀</span>
      <span class="scoreNum" id="scoreB">0</span>
      <div class="scoreBtns">
        <button class="sBtn plus" data-team="B" data-d="1" aria-label="B팀 점수 올리기">+</button>
        <button class="sBtn minus" data-team="B" data-d="-1" aria-label="B팀 점수 내리기">−</button>
      </div>
    </div>
  </div>
  <div class="ring" id="ring"></div>
  <div class="bigWrap"><div class="big" id="big"></div></div>
  <div class="listen" id="listenRow" hidden>
    <span class="micPill" id="micPill">듣는 중</span>
    <span class="heard" id="heard"></span>
  </div>
  <p class="verdict" id="verdict"></p>
  <p class="hint" id="hint"></p>
  <form class="typeForm" id="typeForm" hidden>
    <input id="typeIn" placeholder="말하거나 직접 입력하세요" autocomplete="off">
    <button type="submit">확인</button>
  </form>
  <div class="actions" id="actions"></div>
</main>

<div class="answers" id="answersRow">
  <span class="label">정답 리스트</span>
  <div class="chips" id="chips"></div>
  <span class="count" id="answerCount"></span>
</div>

<script>
  const JAMO = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

  /* 텔레스트레이션 단어 카드 — 그림으로 표현하기 좋은 단어들 */
  const TEL_WORDS = {

  /* ── 사운드 ── */
  function ctx(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      /* iOS 오디오 잠금 해제 — 사용자 제스처 안에서 무음 버퍼를 한 번 재생해야 이후 소리가 난다 */
      const buf = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      src.start(0);
    }
    if(audioCtx.state !== 'running') audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, start, dur, vol, type){
    const ac = ctx();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    const t = ac.currentTime + start;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  }

  /* ── 판정 ── */
  function judge(word){
    const cho = choseongOf(word);
    if(cho === null || word.length === 0) return {res:'skip'};
    if(mode === 2 && word.length < 2) return {res:'wrong', word};
    const need = (mode === 1) ? 1 : 2;
    if(cho.slice(0, need) !== target) return {res:'wrong', word};
    if(answers.some(a => a.word === word)) return {res:'dup', word};
    return {res:'ok', word};
  }

  function handleUtterance(transcript){
    if(!answerActive) return;
    heard.textContent = '“' + transcript.trim() + '”';
    const tokens = transcript.split(/\s+/)
      .map(t => t.replace(/[^가-힣]/g, ''))
      .filter(t => t.length > 0);
    if(tokens.length === 0) return;

    let lastFail = null;
    for(const t of tokens){
      const j = judge(t);
      if(j.res === 'ok'){
        accept(t);
        return;
      }
      if(j.res !== 'skip') lastFail = j;
    }
    if(lastFail) reject(lastFail);
  }

    else if(j.res !== 'skip') reject(j);
    else showVerdict('✗ 한글 단어만 입력할 수 있어요', 'bad');
  });

  /* ── 팀 점수판 ── */
  const scoreboard = document.getElementById('scoreboard');
  const scoreTog   = document.getElementById('scoreTog');
  const scores = { A: 0, B: 0 };

  scoreTog.addEventListener('click', () => {
    scoreboard.hidden = !scoreboard.hidden;
    scoreTog.setAttribute('aria-pressed', String(!scoreboard.hidden));
  });

  function renderScore(team){
    const el = document.getElementById('score' + team);
    el.textContent = scores[team];
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  scoreboard.addEventListener('click', e => {
    const b = e.target.closest('.sBtn');
    if(!b) return;
    const t = b.dataset.team;
    scores[t] = Math.max(0, scores[t] + parseInt(b.dataset.d, 10));
    renderScore(t);
    if(soundOn){ ctx(); tone(b.dataset.d > 0 ? 988 : 494, 0, 0.1, 0.14); }
  });

  document.getElementById('scoreReset').addEventListener('click', () => {
    scores.A = 0; scores.B = 0;
    renderScore('A'); renderScore('B');
  });

  /* ── 게임 전환 ── */
  let gameMode = 'cho';   // 'cho' | 'tel' | 'emo'
  function setGame(g){
    if(running || g === gameMode) return;
    gameMode = g;
    gameChoBtn.setAttribute('aria-pressed', String(g === 'cho'));
    gameTelBtn.setAttribute('aria-pressed', String(g === 'tel'));
    gameEmoBtn.setAttribute('aria-pressed', String(g === 'emo'));
    choModesEl.hidden = g !== 'cho';
    telModesEl.hidden = g !== 'tel';
    emoModesEl.hidden = g !== 'emo';
    micBtn.hidden = g !== 'cho';
    answersRow.hidden = g !== 'cho';
    if(g === 'cho'){
      renderAnswers();
      resetStage();
    } else {
      pauseListening();
      stopRecogOnly();
      if(g === 'tel') telReset(); else emoReset();
    }
  }
  gameChoBtn.addEventListener('click', () => setGame('cho'));
  gameTelBtn.addEventListener('click', () => setGame('tel'));
  gameEmoBtn.addEventListener('click', () => setGame('emo'));

  /* ── 이모지 퀴즈 ── */
  let emoCat = 'movie';
  let emoDeck = [];
  let emoItem = null;

  emoModesEl.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      emoCat = b.dataset.cat;
      emoModesEl.querySelectorAll('button').forEach(x =>
        x.setAttribute('aria-pressed', String(x === b)));
      emoDeck = [];
      emoReset();
    });
  });

  function emoDraw(){
    if(emoDeck.length === 0){
      emoDeck = EMOJI_QUIZ[emoCat].slice();
      for(let i = emoDeck.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [emoDeck[i], emoDeck[j]] = [emoDeck[j], emoDeck[i]];
      }
    }
    emoItem = emoDeck.pop();
  }

  function emoQuestion(){
    ctx();
    emoDraw();
    big.className = 'big emoji';
    big.textContent = emoItem.e;
    chimeReveal();
    hint.innerHTML = '이 이모지가 표현하는 <b>' + EMO_CAT_NAMES[emoCat] + '</b> 제목은?<br>다 함께 정답을 외쳐 보세요!';
    actions.innerHTML =
      '<button class="btn btn-next" id="emoAnswerBtn">정답 공개</button>' +
      '<button class="btn btn-reset" id="emoHomeBtn">처음으로</button>';
    document.getElementById('emoAnswerBtn').addEventListener('click', emoAnswer);
    document.getElementById('emoHomeBtn').addEventListener('click', emoReset);
  }

  function emoAnswer(){
    big.className = 'big word title';
    big.textContent = emoItem.a;
    chimePass();
    hint.innerHTML = emoItem.e + '<br>맞히셨나요? 다음 문제로 넘어가 보세요!';
    actions.innerHTML =
      '<button class="btn btn-start" id="emoNextBtn">다음 문제</button>' +
      '<button class="btn btn-reset" id="emoHomeBtn2">처음으로</button>';
    document.getElementById('emoNextBtn').addEventListener('click', emoQuestion);
    document.getElementById('emoHomeBtn2').addEventListener('click', emoReset);
  }

  function emoReset(){
    big.className = 'big';
    big.textContent = '';
    verdictEl.textContent = '';
    verdictEl.className = 'verdict';
    hint.innerHTML = '「문제 뽑기」를 누르면 <b>' + EMO_CAT_NAMES[emoCat] + '</b> 제목을 표현한 이모지 문제가 나옵니다.<br>다 함께 보고 정답을 외쳐 보세요!';
    actions.innerHTML = '<button class="btn btn-start" id="emoDrawBtn">문제 뽑기</button>';
    document.getElementById('emoDrawBtn').addEventListener('click', emoQuestion);
  }

  /* ── 텔레스트레이션 ── */
  let telLevel = 'easy';
  let telDeck = [];
  let telWord = null;
  let telPrev = null;

  telModesEl.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      telLevel = b.dataset.level;
      telModesEl.querySelectorAll('button').forEach(x =>
        x.setAttribute('aria-pressed', String(x === b)));
      telDeck = [];
      telReset();
    });
  });

  function telDraw(){
    if(telDeck.length === 0){
      telDeck = TEL_WORDS[telLevel].slice();
      for(let i = telDeck.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [telDeck[i], telDeck[j]] = [telDeck[j], telDeck[i]];
      }
      /* 새로 섞은 덱의 첫 카드가 직전 단어와 겹치지 않게 */
      if(telDeck.length > 1 && telDeck[telDeck.length - 1] === telPrev){
        telDeck.unshift(telDeck.pop());
      }
    }
    telWord = telDeck.pop();
    telPrev = telWord;
  }

  function telReady(){
    ctx();
    telDraw();
    big.className = 'big qmark';
    big.textContent = '?';
    if(soundOn) tone(660, 0, 0.15, 0.18);
    hint.innerHTML = '그리는 사람만 <b>단어 확인</b>을 누르세요!<br>다른 사람은 화면을 보면 안 돼요 🙈';
    actions.innerHTML =
      '<button class="btn btn-start" id="telRevealBtn">단어 확인</button>' +
      '<button class="btn btn-reset" id="telHomeBtn">처음으로</button>';
    document.getElementById('telRevealBtn').addEventListener('click', telReveal);
    document.getElementById('telHomeBtn').addEventListener('click', telReset);
  }

  function telReveal(){
    big.className = 'big word';
    big.textContent = telWord;
    chimeReveal();
    hint.innerHTML = '이 단어를 <b>그림으로만</b> 표현하세요! (글자·숫자 금지)<br>다 그렸으면 스케치북을 다음 사람에게 넘기세요';
    actions.innerHTML =
      '<button class="btn btn-next" id="telNextBtn">다음 카드</button>' +
      '<button class="btn btn-reset" id="telHomeBtn2">처음으로</button>';
    document.getElementById('telNextBtn').addEventListener('click', telReady);
    document.getElementById('telHomeBtn2').addEventListener('click', telReset);
  }

  function telReset(){
    big.className = 'big';
    big.textContent = '';
    verdictEl.textContent = '';
    verdictEl.className = 'verdict';
    hint.innerHTML = '「카드 뽑기」를 누르면 <b>' + TEL_LEVEL_NAMES[telLevel] + '</b> 난이도의 단어 카드가 준비됩니다.<br>그림 → 추측 → 그림으로 이어지는 텔레스트레이션을 즐겨 보세요!';
    actions.innerHTML = '<button class="btn btn-start" id="telDrawBtn">카드 뽑기</button>';
    document.getElementById('telDrawBtn').addEventListener('click', telReady);
  }

  /* ── 모드 ── */
  function setMode(m){
    if(running) return;
    mode = m;
    mode1Btn.setAttribute('aria-pressed', String(m === 1));
    mode2Btn.setAttribute('aria-pressed', String(m === 2));
    resetStage();
  }
  mode1Btn.addEventListener('click', () => setMode(1));
  mode2Btn.addEventListener('click', () => setMode(2));

  /* ── 뽑기 ── */
  function rand(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
  function pickJamo(){
    let pick;
    do {
      pick = (mode === 1) ? rand(JAMO) : rand(JAMO) + rand(JAMO);
    } while (pick === lastPick);
    lastPick = pick;
    return pick;
  }

  /* ── 진행 ── */
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function flashRing(){
    ring.classList.remove('go');
    void ring.offsetWidth;
    ring.classList.add('go');
  }

  async function round(){
    if(running) return;
    running = true;
    pauseListening();
    if(!IS_IOS) stopRecogOnly();   // Windows 통신 감지 음소거 회피 — iOS는 인식을 유지해야 허용창이 다시 뜨지 않음
    answers = [];          // 새 초성마다 정답 리스트 리셋
    renderAnswers();
    mode1Btn.disabled = mode2Btn.disabled = true;
    hint.textContent = '';
    verdictEl.textContent = '';
    verdictEl.className = 'verdict';
    actions.innerHTML = '';

    const colors = ['', 'n1', 'n2', ''];
    for(let n = 3; n >= 1; n--){
      big.className = 'big count ' + colors[n];
      big.textContent = n;
      ring.style.color = getComputedStyle(big).color;
      flashRing();
      beepCount();
      void big.offsetWidth;
      await sleep(1000);
    }

    target = pickJamo();
    big.className = 'big jamo' + (mode === 2 ? ' two' : '');
    big.textContent = target;
    chimeReveal();

    hint.textContent = (mode === 1)
      ? '이 초성으로 시작하는 단어를 외쳐 보세요!'
      : '앞 두 글자의 초성이 일치하는 단어를 외쳐 보세요!';

    answerActive = true;
    typeForm.hidden = false;
    updateListenUI();
    setTimeout(startRecog, 400);   // 공개 차임이 울린 뒤에 마이크를 켠다

    actions.innerHTML =
      '<button class="btn btn-next" id="nextBtn">다 음</button>' +
      '<button class="btn btn-reset" id="resetBtn">처음으로</button>';
    document.getElementById('nextBtn').addEventListener('click', () => {
      running = false; lockModes(false);
      if(IS_IOS){ stopRecogOnly(); startRecog(); }   // 터치 제스처 안에서 새로 시작해야 iOS에서 안정적
      round();
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      running = false;
      answers = [];
      lastPick = null;
      renderAnswers();
      resetStage();
    });

    running = false;
    lockModes(false);
  }

  function lockModes(lock){
    mode1Btn.disabled = mode2Btn.disabled = lock;
  }

  function renderAnswers(){
    answerCount.textContent = answers.length ? answers.length + '개' : '';
    chips.innerHTML = answers.length
      ? answers.map((a, i) =>
          '<span class="chip' + (i === 0 ? ' latest' : '') + '">' + a.word + '</span>').join('')
      : '<span class="chip placeholder">정답을 외치면 여기에 쌓여요</span>';
  }
  renderAnswers();

  function resetStage(){
    pauseListening();
    big.className = 'big';
    big.textContent = '';
    verdictEl.textContent = '';
    verdictEl.className = 'verdict';
    hint.innerHTML = (mode === 1)
      ? '시작 버튼을 누르면 3초 카운트다운 후 랜덤 초성이 공개됩니다.<br>초성이 나오면 단어를 외치세요 - 정답 시 하단에 리스트가 쌓입니다!'
      : '시작 버튼을 누르면 3초 카운트다운 후 랜덤 초성 <b>두 글자</b>가 공개됩니다.<br>초성이 나오면 단어를 외치세요 - 정답 시 하단에 리스트가 쌓입니다!';
    actions.innerHTML = '<button class="btn btn-start" id="startBtn">시 작</button>';
    document.getElementById('startBtn').addEventListener('click', () => {
      ctx();
      if(IS_IOS){ stopRecogOnly(); startRecog(); }   // iOS는 터치 순간에 인식을 시작해야 허용창이 시작 시점에 뜨고 안정적
      round();                   // 그 외 환경에서는 초성 공개 후에 마이크가 켜진다
    });
    lockModes(false);
  }

  resetStage();
</script>

</html>

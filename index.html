<meta charset="utf-8">
<title>초성 룰렛</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
  :root{
    --ground:#1A1040;
    --ground-deep:#120A2E;
    --panel:#261A57;
    --panel-edge:#3A2A7A;
    --amber:#FFC93C;
    --pink:#FF5C8A;
    --mint:#4EE6B8;
    --text:#F5F1FF;
    --text-dim:#B9AEE0;
    --display:'Black Han Sans', 'Noto Sans KR', sans-serif;
    --body:'Gowun Dodum', 'Noto Sans KR', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #2E1E66 0%, var(--ground) 55%, var(--ground-deep) 100%);
    color:var(--text);
    font-family:var(--body);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:24px 16px 32px;
  }

  /* ── 헤더 ─────────────────────────── */
  header{
    width:100%;
    max-width:860px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand h1{
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(24px, 4vw, 32px);
    letter-spacing:1px;
    color:var(--text);
  }
  .brand h1 .dot{color:var(--pink);}
  .brand .tag{
    font-size:13px;
    color:var(--text-dim);
    letter-spacing:2px;
  }
  .headBtns{display:flex; gap:8px;}
  .pillBtn{
    background:var(--panel);
    border:1px solid var(--panel-edge);
    color:var(--text);
    border-radius:999px;
    padding:8px 16px;
    font-family:var(--body);
    font-size:14px;
    cursor:pointer;
    transition:background .15s;
  }
  .pillBtn:hover{background:var(--panel-edge);}
  .pillBtn:focus-visible{outline:2px solid var(--mint); outline-offset:2px;}
  .pillBtn[aria-pressed="false"]{color:var(--text-dim);}

  /* ── 모드 탭 ─────────────────────────── */
  .modes{
    margin-top:22px;
    display:flex;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:999px;
    padding:6px;
  }
  .modes button{
    border:0;
    background:transparent;
    color:var(--text-dim);
    font-family:var(--body);
    font-size:15px;
    padding:10px 22px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .modes button[aria-pressed="true"]{
    background:var(--amber);
    color:#241500;
  }
  .modes button:focus-visible{outline:2px solid var(--mint); outline-offset:2px;}
  .modes button:disabled{opacity:.45; cursor:default;}

  /* ── 무대 ─────────────────────────── */
  .stage{
    margin-top:26px;
    width:100%;
    max-width:860px;
    flex:1;
    min-height:420px;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    position:relative;
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
    padding:24px 16px;
  }
  .stage::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(520px 320px at 50% 42%, rgba(255,201,60,.10), transparent 70%);
    pointer-events:none;
  }

  .hint{
    color:var(--text-dim);
    font-size:16px;
    text-align:center;
    line-height:1.7;
    max-width:34em;
    padding:0 20px;
  }

  /* 대형 표시 영역 */
  .bigWrap{
    height:clamp(150px, 28vh, 260px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .big{
    font-family:var(--display);
    font-weight:400;
    line-height:1;
    font-size:clamp(100px, 22vw, 200px);
    letter-spacing:.04em;
    user-select:none;
  }
  .big.count{color:var(--amber);}
  .big.count.n2{color:var(--mint);}
  .big.count.n1{color:var(--pink);}
  .big.jamo{
    color:var(--pink);
    text-shadow:0 0 60px rgba(255,92,138,.45);
  }

  @keyframes pop{
    0%  {transform:scale(2.2); opacity:0;}
    55% {transform:scale(.95); opacity:1;}
    100%{transform:scale(1);   opacity:1;}
  }
  @keyframes reveal{
    0%  {transform:scale(.3) rotate(-6deg); opacity:0;}
    60% {transform:scale(1.12) rotate(2deg); opacity:1;}
    100%{transform:scale(1) rotate(0);      opacity:1;}
  }
  .big.count{animation:pop .9s cubic-bezier(.2,.9,.3,1) both;}
  .big.jamo{animation:reveal .55s cubic-bezier(.2,.9,.3,1.2) both;}

  .ring{
    position:absolute;
    width:clamp(220px, 36vh, 340px);
    height:clamp(220px, 36vh, 340px);
    border-radius:50%;
    border:3px solid currentColor;
    opacity:0;
    pointer-events:none;
  }
  @keyframes ringOut{
    0%  {transform:scale(.6); opacity:.7;}
    100%{transform:scale(1.25); opacity:0;}
  }
  .ring.go{animation:ringOut .85s ease-out both;}

  /* ── 듣기 상태 / 판정 ─────────────────── */
  .listen{
    display:flex;
    align-items:center;
    gap:10px;
    min-height:32px;
  }
  .micPill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(78,230,184,.12);
    border:1px solid rgba(78,230,184,.4);
    color:var(--mint);
    border-radius:999px;
    padding:6px 14px;
    font-size:14px;
  }
  .micPill::before{
    content:"";
    width:8px; height:8px;
    border-radius:50%;
    background:var(--mint);
    animation:blink 1.2s ease-in-out infinite;
  }
  .micPill.off{
    color:var(--text-dim);
    border-color:var(--panel-edge);
    background:transparent;
  }
  .micPill.off::before{background:var(--text-dim); animation:none;}
  @keyframes blink{0%,100%{opacity:1;} 50%{opacity:.25;}}
  .heard{
    color:var(--text-dim);
    font-size:15px;
    max-width:26em;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .verdict{
    min-height:30px;
    font-size:19px;
    text-align:center;
  }
  .verdict.ok{color:var(--mint);}
  .verdict.bad{color:var(--pink); animation:shake .35s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-7px);}
    50%{transform:translateX(7px);}
    75%{transform:translateX(-4px);}
  }

  @media (prefers-reduced-motion: reduce){
    .big.count, .big.jamo{animation:none;}
    .ring.go{animation:none; opacity:0;}
    .micPill::before{animation:none;}
    .verdict.bad{animation:none;}
  }

  /* ── 직접 입력 ─────────────────────── */
  .typeForm{
    display:flex;
    gap:8px;
  }
  .typeForm input{
    background:var(--ground-deep);
    border:1px solid var(--panel-edge);
    border-radius:12px;
    color:var(--text);
    font-family:var(--body);
    font-size:16px;
    padding:10px 16px;
    width:min(280px, 60vw);
  }
  .typeForm input::placeholder{color:var(--text-dim); opacity:.7;}
  .typeForm input:focus-visible{outline:2px solid var(--mint); outline-offset:1px;}
  .typeForm button{
    background:var(--panel-edge);
    border:0;
    border-radius:12px;
    color:var(--text);
    font-family:var(--body);
    font-size:15px;
    padding:10px 18px;
    cursor:pointer;
  }
  .typeForm button:hover{filter:brightness(1.2);}
  .typeForm button:focus-visible{outline:2px solid var(--mint); outline-offset:2px;}

  /* ── 버튼 ─────────────────────────── */
  .actions{display:flex; gap:14px;}
  .btn{
    font-family:var(--display);
    font-weight:400;
    font-size:22px;
    letter-spacing:2px;
    border:0;
    border-radius:18px;
    padding:16px 44px;
    cursor:pointer;
    transition:transform .12s, filter .15s;
  }
  .btn:hover{filter:brightness(1.1); transform:translateY(-2px);}
  .btn:active{transform:translateY(0) scale(.97);}
  .btn:focus-visible{outline:3px solid var(--mint); outline-offset:3px;}
  .btn-start{
    background:linear-gradient(180deg, #FFD75E, var(--amber));
    color:#241500;
    box-shadow:0 10px 30px rgba(255,201,60,.30);
  }
  .btn-next{
    background:linear-gradient(180deg, #FF7CA0, var(--pink));
    color:#3A0016;
    box-shadow:0 10px 30px rgba(255,92,138,.30);
  }
  .btn-reset{
    background:transparent;
    border:1px solid var(--panel-edge);
    color:var(--text-dim);
    font-family:var(--body);
    font-size:15px;
    letter-spacing:0;
    padding:16px 24px;
  }
  .btn-reset:hover{color:var(--text);}

  /* ── 정답 단어 ─────────────────────── */
  .answers{
    margin-top:20px;
    width:100%;
    max-width:860px;
    min-height:44px;
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .answers .label{
    font-size:13px;
    color:var(--text-dim);
    letter-spacing:2px;
    white-space:nowrap;
    padding-top:9px;
  }
  .answers .count{
    color:var(--mint);
    font-size:13px;
    padding-top:9px;
  }
  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    font-family:var(--body);
    font-size:16px;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:12px;
    padding:7px 14px;
  }
  .chip b{
    font-family:var(--display);
    font-weight:400;
    color:var(--text-dim);
    font-size:13px;
    margin-right:6px;
  }
  .chip.latest{border-color:var(--mint); color:var(--mint);}
  .chip.latest b{color:var(--mint);}
</style>

<header>
  <div class="brand">
    <h1>초성 룰렛<span class="dot">.</span></h1>
    <span class="tag">CHOSEONG GAME</span>
  </div>
  <div class="headBtns">
    <button class="pillBtn" id="micBtn" aria-pressed="true">🎤 음성 인식 켜짐</button>
    <button class="pillBtn" id="soundBtn" aria-pressed="true">🔊 소리 켜짐</button>
  </div>
</header>

<div class="modes" role="group" aria-label="게임 모드">
  <button id="mode1" aria-pressed="true">초성 한 글자</button>
  <button id="mode2" aria-pressed="false">초성 두 글자</button>
</div>

<main class="stage" aria-live="polite">
  <div class="ring" id="ring"></div>
  <div class="bigWrap"><div class="big" id="big"></div></div>
  <div class="listen" id="listenRow" hidden>
    <span class="micPill" id="micPill">듣는 중</span>
    <span class="heard" id="heard"></span>
  </div>
  <p class="verdict" id="verdict"></p>
  <p class="hint" id="hint"></p>
  <form class="typeForm" id="typeForm" hidden>
    <input id="typeIn" placeholder="말하거나 직접 입력하세요" autocomplete="off">
    <button type="submit">확인</button>
  </form>
  <div class="actions" id="actions"></div>
</main>

<div class="answers" id="answersRow" hidden>
  <span class="label">정답 리스트</span>
  <div class="chips" id="chips"></div>
  <span class="count" id="answerCount"></span>
</div>

<script>
  const JAMO = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const CHO_LIST = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

  const big        = document.getElementById('big');
  const ring       = document.getElementById('ring');
  const hint       = document.getElementById('hint');
  const actions    = document.getElementById('actions');
  const listenRow  = document.getElementById('listenRow');
  const micPill    = document.getElementById('micPill');
  const heard      = document.getElementById('heard');
  const verdictEl  = document.getElementById('verdict');
  const typeForm   = document.getElementById('typeForm');
  const typeIn     = document.getElementById('typeIn');
  const answersRow = document.getElementById('answersRow');
  const chips      = document.getElementById('chips');
  const answerCount= document.getElementById('answerCount');
  const soundBtn   = document.getElementById('soundBtn');
  const micBtn     = document.getElementById('micBtn');
  const mode1Btn   = document.getElementById('mode1');
  const mode2Btn   = document.getElementById('mode2');

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  let mode = 1;
  let running = false;
  let soundOn = true;
  let micOn = !!SR;
  let lastPick = null;
  let target = null;          // 현재 라운드의 초성
  let answerActive = false;   // 초성 공개 후 답을 받는 상태인가
  let answers = [];           // [{word, cho}]
  let recog = null;
  let audioCtx = null;
  let verdictTimer = null;

  if(!SR){
    micBtn.textContent = '🎤 음성 인식 미지원';
    micBtn.disabled = true;
    micBtn.setAttribute('aria-pressed','false');
  }

  /* ── 사운드 ── */
  function ctx(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, start, dur, vol, type){
    const ac = ctx();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    const t = ac.currentTime + start;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  }
  function beepCount(){ if(soundOn) tone(660, 0, 0.22, 0.22); }
  function chimeReveal(){
    if(!soundOn) return;
    tone(880, 0, 0.35, 0.20);
    tone(1108.7, 0.09, 0.35, 0.16);
    tone(1318.5, 0.18, 0.5, 0.16);
  }
  function chimePass(){
    if(!soundOn) return;
    tone(987.8, 0, 0.18, 0.2);
    tone(1318.5, 0.1, 0.3, 0.2);
  }
  function buzzFail(){
    if(!soundOn) return;
    tone(196, 0, 0.28, 0.18, 'square');
    tone(185, 0.05, 0.28, 0.12, 'square');
  }

  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊 소리 켜짐' : '🔇 소리 꺼짐';
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    if(soundOn) ctx();
  });

  micBtn.addEventListener('click', () => {
    if(!SR) return;
    micOn = !micOn;
    micBtn.textContent = micOn ? '🎤 음성 인식 켜짐' : '🎤 음성 인식 꺼짐';
    micBtn.setAttribute('aria-pressed', String(micOn));
    if(micOn) startRecog();
    else stopRecogOnly();
    updateListenUI();
  });

  /* ── 초성 분해 ── */
  function choseongOf(word){
    let out = '';
    for(const ch of word){
      const c = ch.charCodeAt(0) - 0xAC00;
      if(c < 0 || c > 11171) return null;   // 한글 음절이 아님
      out += CHO_LIST[Math.floor(c / 588)];
    }
    return out;
  }

  /* ── 음성 인식 ── */
  function startRecog(){
    if(!SR || !micOn) return;
    if(recog) return;   // 이미 돌고 있으면 그대로 유지 — 껐다 켜면 권한창이 다시 뜬다
    recog = new SR();
    recog.lang = 'ko-KR';
    recog.continuous = true;
    recog.interimResults = true;
    recog.onresult = e => {
      let interim = '';
      for(let i = e.resultIndex; i < e.results.length; i++){
        const r = e.results[i];
        if(r.isFinal) handleUtterance(r[0].transcript);
        else interim += r[0].transcript;
      }
      if(interim) heard.textContent = '“' + interim.trim() + '”';
    };
    recog.onstart = () => { updateListenUI(); };
    recog.onerror = e => {
      if(e.error === 'no-speech' || e.error === 'aborted') return;   // 무해한 오류는 무시
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        micOn = false;
        micBtn.textContent = '🎤 마이크 권한 필요';
        micBtn.setAttribute('aria-pressed','false');
        stopRecogOnly();
        updateListenUI();
        return;
      }
      const msg = {
        'audio-capture': '마이크를 찾을 수 없어요 — 마이크 연결을 확인하세요',
        'network': '음성 인식 서버 연결 실패 — 인터넷 연결을 확인하세요',
        'language-not-supported': '이 브라우저는 한국어 음성 인식을 지원하지 않아요 — Chrome으로 열어 보세요'
      }[e.error] || ('음성 인식 오류: ' + e.error);
      showVerdict('✗ ' + msg, 'bad');
    };
    recog.onend = () => {
      if(micOn && recog){
        setTimeout(() => {
          if(micOn && recog){ try{ recog.start(); }catch(err){} }
        }, 250);
      }
    };
    try{ recog.start(); }catch(err){}
    updateListenUI();
  }
  function stopRecogOnly(){
    if(recog){
      recog.onend = null;
      recog.onresult = null;
      try{ recog.stop(); }catch(err){}
      recog = null;
    }
  }
  /* 인식은 계속 돌리되 결과만 무시하는 '일시정지' — 권한창 재등장 방지 */
  function pauseListening(){
    answerActive = false;
    heard.textContent = '';
    listenRow.hidden = true;
    typeForm.hidden = true;
  }
  function updateListenUI(){
    if(!answerActive){ listenRow.hidden = true; return; }
    listenRow.hidden = false;
    if(SR && micOn){
      micPill.textContent = '듣는 중';
      micPill.className = 'micPill';
    } else {
      micPill.textContent = SR ? '음성 인식 꺼짐' : '이 브라우저는 음성 인식 미지원 — 직접 입력하세요';
      micPill.className = 'micPill off';
    }
  }

  /* ── 판정 ── */
  function judge(word){
    const cho = choseongOf(word);
    if(cho === null || word.length === 0) return {res:'skip'};
    if(mode === 2 && word.length < 2) return {res:'wrong', word};
    const need = (mode === 1) ? 1 : 2;
    if(cho.slice(0, need) !== target) return {res:'wrong', word};
    if(answers.some(a => a.word === word)) return {res:'dup', word};
    return {res:'ok', word};
  }

  function handleUtterance(transcript){
    if(!answerActive) return;
    heard.textContent = '“' + transcript.trim() + '”';
    const tokens = transcript.split(/\s+/)
      .map(t => t.replace(/[^가-힣]/g, ''))
      .filter(t => t.length > 0);
    if(tokens.length === 0) return;

    let lastFail = null;
    for(const t of tokens){
      const j = judge(t);
      if(j.res === 'ok'){
        accept(t);
        return;
      }
      if(j.res !== 'skip') lastFail = j;
    }
    if(lastFail) reject(lastFail);
  }

  function accept(word){
    answers.unshift({word, cho: target});
    renderAnswers();
    chimePass();
    showVerdict('✓ 통과! 「' + word + '」', 'ok');
  }
  function reject(j){
    buzzFail();
    if(j.res === 'dup') showVerdict('✗ 「' + j.word + '」 — 이미 나온 단어예요', 'bad');
    else showVerdict('✗ 「' + j.word + '」 — 초성이 맞지 않아요', 'bad');
  }
  function showVerdict(msg, cls){
    clearTimeout(verdictTimer);
    verdictEl.textContent = msg;
    verdictEl.className = 'verdict ' + cls;
    verdictTimer = setTimeout(() => {
      verdictEl.textContent = '';
      verdictEl.className = 'verdict';
    }, 3000);
  }

  /* ── 직접 입력 ── */
  typeForm.addEventListener('submit', e => {
    e.preventDefault();
    if(!answerActive) return;
    const word = typeIn.value.replace(/[^가-힣]/g, '');
    typeIn.value = '';
    if(!word) return;
    const j = judge(word);
    if(j.res === 'ok') accept(word);
    else if(j.res !== 'skip') reject(j);
    else showVerdict('✗ 한글 단어만 입력할 수 있어요', 'bad');
  });

  /* ── 모드 ── */
  function setMode(m){
    if(running) return;
    mode = m;
    mode1Btn.setAttribute('aria-pressed', String(m === 1));
    mode2Btn.setAttribute('aria-pressed', String(m === 2));
    resetStage();
  }
  mode1Btn.addEventListener('click', () => setMode(1));
  mode2Btn.addEventListener('click', () => setMode(2));

  /* ── 뽑기 ── */
  function rand(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
  function pickJamo(){
    let pick;
    do {
      pick = (mode === 1) ? rand(JAMO) : rand(JAMO) + rand(JAMO);
    } while (pick === lastPick);
    lastPick = pick;
    return pick;
  }

  /* ── 진행 ── */
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function flashRing(){
    ring.classList.remove('go');
    void ring.offsetWidth;
    ring.classList.add('go');
  }

  async function round(){
    if(running) return;
    running = true;
    pauseListening();
    stopRecogOnly();       // 카운트다운 동안 마이크를 꺼서 Windows 통신 감지 음소거를 피한다
    answers = [];          // 새 초성마다 정답 리스트 리셋
    renderAnswers();
    mode1Btn.disabled = mode2Btn.disabled = true;
    hint.textContent = '';
    verdictEl.textContent = '';
    verdictEl.className = 'verdict';
    actions.innerHTML = '';

    const colors = ['', 'n1', 'n2', ''];
    for(let n = 3; n >= 1; n--){
      big.className = 'big count ' + colors[n];
      big.textContent = n;
      ring.style.color = getComputedStyle(big).color;
      flashRing();
      beepCount();
      void big.offsetWidth;
      await sleep(1000);
    }

    target = pickJamo();
    big.className = 'big jamo';
    big.textContent = target;
    chimeReveal();

    hint.textContent = (mode === 1)
      ? '이 초성으로 시작하는 단어를 외쳐 보세요!'
      : '앞 두 글자의 초성이 일치하는 단어를 외쳐 보세요!';

    answerActive = true;
    typeForm.hidden = false;
    updateListenUI();
    setTimeout(startRecog, 400);   // 공개 차임이 울린 뒤에 마이크를 켠다

    actions.innerHTML =
      '<button class="btn btn-next" id="nextBtn">다 음</button>' +
      '<button class="btn btn-reset" id="resetBtn">처음으로</button>';
    document.getElementById('nextBtn').addEventListener('click', () => {
      running = false; lockModes(false); round();
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      running = false;
      answers = [];
      lastPick = null;
      renderAnswers();
      resetStage();
    });

    running = false;
    lockModes(false);
  }

  function lockModes(lock){
    mode1Btn.disabled = mode2Btn.disabled = lock;
  }

  function renderAnswers(){
    answersRow.hidden = answers.length === 0;
    answerCount.textContent = answers.length ? answers.length + '개' : '';
    chips.innerHTML = answers
      .map((a, i) =>
        '<span class="chip' + (i === 0 ? ' latest' : '') + '">' + a.word + '</span>')
      .join('');
  }

  function resetStage(){
    pauseListening();
    big.className = 'big';
    big.textContent = '';
    verdictEl.textContent = '';
    verdictEl.className = 'verdict';
    hint.innerHTML = (mode === 1)
      ? '시작 버튼을 누르면 3초 카운트다운 후 랜덤 초성이 공개됩니다.<br>초성이 나오면 마이크에 대고 단어를 외치세요 — 맞으면 정답 리스트에 쌓입니다!'
      : '시작 버튼을 누르면 3초 카운트다운 후 랜덤 초성 <b>두 글자</b>가 공개됩니다.<br>초성이 나오면 마이크에 대고 단어를 외치세요 — 맞으면 정답 리스트에 쌓입니다!';
    actions.innerHTML = '<button class="btn btn-start" id="startBtn">시 작</button>';
    document.getElementById('startBtn').addEventListener('click', () => {
      ctx();
      round();   // 마이크는 초성 공개 후에 켜진다 — localhost에서는 권한이 영구 기억되어 허용창이 다시 뜨지 않음
    });
    lockModes(false);
  }

  resetStage();
</script>
